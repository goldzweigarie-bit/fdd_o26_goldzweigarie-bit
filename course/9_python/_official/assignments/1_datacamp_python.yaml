id: datacamp-python-developers
type: assignment
authority: official
content:
  title: "DataCamp: Introduction to Python for Developers"
  instructions: >-
    Termina el curso Introduction to Python for Developers de DataCamp y sube
    la evidencia por el flujo del curso. El enlace está abajo, en los recursos,
    y entras con la cuenta del grupo de DataCamp del ITAM, la misma de siempre.
    La unidad de Python da por sabida la sintaxis básica que este curso
    entrena: tipos de datos, listas, diccionarios, condicionales y ciclos. La
    clase no la repite.
    La entrega va en una carpeta llamada python, dentro de tu carpeta de
    estudiante, y es espejo de la que publiqué en codigo. Se copia desde la
    terminal con el comando de siempre, con la barra y el punto al final del
    origen, y no se crea a mano ni se arrastra en el explorador de archivos.
    Ojo con el nombre, porque es el error que más se va a repetir: es python, a
    secas, no cero nueve guion bajo python. Ésa es la carpeta de la otra
    entrega de la semana.
    Deben quedar dos archivos. El primero es certificaciones punto md, la
    plantilla que copiaste, con sus tres secciones llenas: tus usuarios de
    GitHub y de DataCamp, sin tu nombre completo ni tu correo, porque el
    repositorio es público; la fecha
    en que terminaste el curso y la URL del Statement of Accomplishment, que es
    la que se verifica en un clic; y una cosa concreta que aprendiste y no
    sabías, en dos o tres líneas. El segundo es la captura, llamada
    introduccion guion python guion developers punto png, con ese nombre exacto
    porque la plantilla ya la enlaza. Si te sale en jpg no pasa nada, pero
    entonces corriges el enlace dentro del archivo. Un pdf no sirve.
    No se entrega nada más. La captura que sirve es la de la página del curso
    ya terminado, donde se vean tu nombre y el cien por ciento completado. No
    sirve una foto del certificado suelto sin contexto, ni la de un ejercicio
    suelto, ni una donde no se distinga de qué curso se trata.
    La entrega es un pull request desde su propia branch, que se llama tarea
    guion cero nueve guion datacamp guion python, con ese nombre exacto, en
    minúsculas y sin acentos, porque la revisión automática lo comprueba. La
    branch nace de main, actualizado contra el repositorio del curso. Vence el
    mismo día que la entrega de tu ambiente en Docker y son dos entregas
    distintas: dos branches y dos pull requests, las dos nacidas de main y
    ninguna de la otra. Un pull request toca una sola subcarpeta tuya, y éste
    toca python y nada más.
    La fecha se escribe como año, guion, mes, guion, día: por ejemplo, el
    cinco de octubre se escribe dos mil veintiséis guion diez guion cero
    cinco. Otra forma, como cinco de octubre o cinco diagonal diez, la rechaza
    la revisión automática, porque esa forma se lee igual en cualquier país y
    se puede comparar con otras fechas sin adivinar.
    Puedes usar inteligencia artificial para estudiar, pero tienes que poder
    explicar sin ayuda qué diferencia hay entre una lista y un diccionario y
    cuándo usar cada uno, qué recorre un for sobre un diccionario y cómo
    recorrer llaves y valores a la vez, cuándo conviene un while en lugar de
    un for y qué hace break, y la cosa que escribiste en la sección de lo que
    aprendiste, contada sin leerla.
    Sabrás que terminaste cuando el pull request esté abierto y su revisión
    esté en verde. Si sale roja, lee el mensaje, corrige y haz push a la misma
    branch; el pull request se actualiza solo. El verde comprueba que todo
    vive en tu carpeta, que la branch se llama como debe, que están el archivo
    y la captura, que las tres secciones están llenas y que la fecha y la URL
    tienen la forma pedida. No comprueba que la captura sea tuya ni de este
    curso, ni que la URL abra tu certificado: eso lo reviso yo. Si no
    alcanzaste a terminar el curso, sube lo que sí completaste y dilo en el
    archivo: reportar el pendiente cuenta como entrega, presumir un avance que
    no ocurrió no.
