<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Cuatro capas apiladas de abajo hacia arriba: kernel, librerias y programas del sistema, interprete de Python y paquetes de Python. A la derecha, tres barras verticales muestran que cubre cada herramienta: el .venv de uv cubre los paquetes y el interprete si uv lo instalo; conda y pixi cubren paquetes, interprete y parte de las librerias del sistema; Docker cubre todo menos el kernel. Al pie: ninguno aisla el kernel, eso es una maquina virtual"><rect x="0" y="0" width="1080" height="480" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué capa aísla cada uno</text><rect x="40" y="90" width="420" height="70" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="250" y="131.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">paquetes de Python</text><rect x="40" y="168" width="420" height="70" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="250" y="209.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">intérprete de Python</text><rect x="40" y="246" width="420" height="70" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="250" y="287.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">librerías y programas del sistema</text><rect x="40" y="324" width="420" height="70" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="250" y="365.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">kernel</text><text x="580" y="76" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">.venv (uv)</text><rect x="550" y="90" width="60" height="109.0" rx="8" fill="#7ef29d" fill-opacity="0.35" stroke="#7ef29d" stroke-width="2"/><text x="760" y="76" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conda / pixi</text><rect x="730" y="90" width="60" height="187.0" rx="8" fill="#6fd8e8" fill-opacity="0.35" stroke="#6fd8e8" stroke-width="2"/><text x="940" y="76" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Docker</text><rect x="910" y="90" width="60" height="226.0" rx="8" fill="#c9a7ff" fill-opacity="0.35" stroke="#c9a7ff" stroke-width="2"/><text x="616" y="193.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">el intérprete,</text><text x="616" y="209.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">si uv lo instaló</text><text x="796" y="271.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sólo las que</text><text x="796" y="287.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">empaqueta</text><text x="540.0" y="440" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Ninguno aísla el kernel: eso lo hace una máquina virtual.</text></svg>