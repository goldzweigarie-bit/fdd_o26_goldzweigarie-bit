<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-label="El arbol de la carpeta .venv a la izquierda y, a la derecha de cada rama, que es: bin/python es el interprete, un enlace al Python base; bin/activate es lo que corre source; lib/python3.13/site-packages guarda los paquetes de este ambiente y de ningun otro, como rich y pygments; pyvenv.cfg dice de que Python salio y su version. Al pie: borrar el ambiente es borrar la carpeta"><rect x="0" y="0" width="1080" height="460" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Un ambiente es una carpeta</text><rect x="40" y="76" width="1000" height="300" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="70" y="116" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">.venv/</text><text x="70" y="154" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">├── bin/</text><text x="560" y="154" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">los programas del ambiente</text><text x="70" y="192" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">│   ├── python</text><text x="560" y="192" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el intérprete: un enlace al Python base</text><text x="70" y="230" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">│   └── activate</text><text x="560" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">lo que corre source (sólo cambia el PATH)</text><text x="70" y="268" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">├── lib/python3.13/site-packages/</text><text x="560" y="268" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">los paquetes de este ambiente y de ningún otro</text><text x="70" y="306" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">│   └── rich/  pygments/  …</text><text x="560" y="306" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">lo que instaló uv add</text><text x="70" y="344" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">└── pyvenv.cfg</text><text x="560" y="344" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de qué Python salió y su versión</text><text x="540.0" y="414" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">borrar el ambiente = borrar la carpeta: rm -rf .venv</text><text x="540.0" y="440" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">nada fuera de .venv/ cambia; uv sync la vuelve a crear</text></svg>