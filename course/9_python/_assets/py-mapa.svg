<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Tres cajas en fila. La primera, lo que pides: pyproject.toml, con rangos como rich mayor o igual a 15, que escribes tu o uv add. Una flecha rotulada uv lock lleva a la segunda, lo que se resolvio: uv.lock, con version exacta y hash de cada paquete, tambien las transitivas, que se bajan de PyPI. Una flecha rotulada uv sync lleva a la tercera, lo que esta instalado: la carpeta .venv con su python y su site-packages, desechable. De .venv sale una flecha uv run hacia tu programa, y uv python install pone el interprete. Abajo: pyproject.toml y uv.lock van a git; .venv no va a git, se borra y se recrea con uv sync"><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué produce qué en un proyecto uv</text><rect x="440" y="70" width="200" height="40" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="540" y="96" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">PyPI</text><line x1="540" y1="112" x2="540" y2="136" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="700" y="96" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de dónde se bajan</text><rect x="40" y="140" width="280" height="150" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="180" y="170" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">lo que pides</text><text x="180" y="206" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">pyproject.toml</text><text x="180" y="240" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">rangos: rich&gt;=15</text><text x="180" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">lo escribes tú o uv add</text><rect x="400" y="140" width="280" height="150" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="540" y="170" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">lo que se resolvió</text><text x="540" y="206" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">uv.lock</text><text x="540" y="240" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">versión exacta + hash</text><text x="540" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">de cada paquete, también las transitivas</text><rect x="760" y="140" width="280" height="150" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="900" y="170" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">lo que está instalado</text><text x="900" y="206" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">.venv/</text><text x="900" y="240" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">bin/python + site-packages/</text><text x="900" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="324" y1="215" x2="394" y2="215" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><rect x="312.5" y="176" width="93" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="359" y="195" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">uv lock</text><line x1="684" y1="215" x2="754" y2="215" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="672.5" y="176" width="93" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="719" y="195" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">uv sync</text><rect x="110" y="360" width="140" height="44" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="180" y="388" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">tú</text><line x1="180" y1="356" x2="180" y2="296" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><rect x="199.5" y="316" width="137" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="268" y="335" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">uv add rich</text><rect x="400" y="360" width="280" height="44" rx="8" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="540" y="387" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">uv python install</text><text x="540" y="424" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el intérprete también lo pone uv</text><line x1="684" y1="382" x2="790" y2="296" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><line x1="900" y1="296" x2="900" y2="356" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="715.0" y="312" width="170" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="800" y="331" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">uv run hola.py</text><rect x="820" y="360" width="160" height="44" rx="8" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="900" y="388" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">tu programa</text><rect x="40" y="462" width="1000" height="70" rx="10" fill="#16302a" stroke="#4a7a63" stroke-width="2"/><text x="60" y="492" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">a git:</text><text x="130" y="492" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">✓ pyproject.toml   ✓ uv.lock</text><text x="470" y="492" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">✗ .venv/</text><text x="560" y="492" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">no va a git: se borra y se recrea con uv sync</text><text x="60" y="518" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Los dos archivos bastan para que otra máquina tenga exactamente tus versiones.</text></svg>