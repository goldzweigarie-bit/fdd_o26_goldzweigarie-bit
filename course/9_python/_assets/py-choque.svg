<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-label="Dos columnas. A la izquierda, sin ambientes: proyecto-a pide pandas 1.5 y proyecto-b pide pandas 2.2, y los dos apuntan al unico site-packages del Python del sistema, donde solo cabe una version, la 2.2; la flecha de proyecto-a termina en rojo porque esperaba 1.5. A la derecha, con un .venv por proyecto: cada proyecto tiene su propio site-packages con su version, y las dos flechas terminan en verde"><rect x="0" y="0" width="1080" height="400" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dos proyectos, un solo Python</text><text x="270" y="86" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">sin ambientes</text><text x="810" y="86" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">con un .venv/ por proyecto</text><line x1="540" y1="70" x2="540" y2="380" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="40" y="110" width="190" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="135" y="138" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">proyecto-a</text><text x="135" y="160" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">pide pandas==1.5</text><rect x="40" y="200" width="190" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="135" y="228" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">proyecto-b</text><text x="135" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">pide pandas==2.2</text><rect x="300" y="120" width="210" height="150" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="405" y="146" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python del sistema</text><text x="405" y="176" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">site-packages/</text><rect x="325" y="196" width="160" height="46" rx="8" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="405" y="225" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pandas 2.2</text><line x1="234" y1="142" x2="320" y2="210" stroke="#ff8a7a" stroke-width="2.2" marker-end="url(#fff8a7a)"/><line x1="234" y1="232" x2="320" y2="226" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><text x="270" y="320" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">una sola ranura: el último que instala gana</text><text x="270" y="346" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">proyecto-a truena sin que nadie tocara su código</text><rect x="580" y="110" width="190" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="675" y="148" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">proyecto-a</text><text x="675" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">pide pandas==1.5</text><rect x="800" y="110" width="230" height="90" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="915" y="140" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">.venv/site-packages/</text><text x="915" y="172" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pandas 1.5</text><line x1="774" y1="155" x2="794" y2="155" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><rect x="580" y="230" width="190" height="90" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="675" y="268" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">proyecto-b</text><text x="675" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">pide pandas==2.2</text><rect x="800" y="230" width="230" height="90" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="915" y="260" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">.venv/site-packages/</text><text x="915" y="292" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pandas 2.2</text><line x1="774" y1="275" x2="794" y2="275" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><text x="810" y="360" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cada proyecto con sus versiones, sin tocarse</text></svg>