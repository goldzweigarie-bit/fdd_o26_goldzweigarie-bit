<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Dos columnas con las carpetas del PATH en el orden en que la shell las recorre buscando python. Sin activar: /usr/local/bin, /usr/bin y /bin; el python3 de /usr/bin gana. Despues de source .venv/bin/activate: la carpeta .venv/bin del proyecto queda primero y su python gana, antes que /usr/local/bin y /usr/bin. Al pie: activate no instala nada, solo pone .venv/bin al frente del PATH, y uv run no necesita activar"><rect x="0" y="0" width="1080" height="480" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué python gana: la shell busca en orden</text><text x="270" y="90" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">sin activar</text><text x="810" y="90" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">source .venv/bin/activate</text><rect x="50" y="116" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="76" y="155" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">1</text><text x="100" y="146" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">/usr/local/bin</text><text x="100" y="168" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no hay python</text><line x1="76" y1="182" x2="76" y2="196" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="50" y="198" width="440" height="64" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="76" y="237" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">2</text><text x="100" y="228" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">/usr/bin</text><text x="100" y="250" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">aquí está python3 → gana</text><line x1="76" y1="264" x2="76" y2="278" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="50" y="280" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="76" y="319" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">3</text><text x="100" y="310" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">/bin</text><text x="100" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ya no se busca</text><rect x="590" y="116" width="440" height="64" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="616" y="155" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">1</text><text x="640" y="146" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">…/09_python/ambientes/demo/.venv/bin</text><text x="640" y="168" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">aquí está python → gana</text><line x1="616" y1="182" x2="616" y2="196" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="590" y="198" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="616" y="237" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">2</text><text x="640" y="228" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">/usr/local/bin</text><text x="640" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ya no se busca</text><line x1="616" y1="264" x2="616" y2="278" stroke="#4a7a63" stroke-width="1.5" marker-end="url(#f4a7a63)"/><rect x="590" y="280" width="440" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="616" y="319" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">3</text><text x="640" y="310" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">/usr/bin</text><text x="640" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ya no se busca</text><text x="540.0" y="400" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">activate no instala nada: sólo pone .venv/bin al frente del PATH</text><text x="540.0" y="430" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">uv run no necesita activar: usa el .venv del proyecto directamente</text></svg>