<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="Arbol de decision de tres preguntas. Necesitas paquetes que no son de Python, como CUDA o GDAL? Si: pixi, o conda. No: el proyecto ya usa poetry, pdm o hatch? Si: usa esa y lee su pyproject.toml. No: es un script suelto? Si: uv run script.py con sus dependencias dentro, PEP 723. No: uv init y uv add, que es el caso de este curso"><rect x="0" y="0" width="1080" height="470" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">¿Cuál uso?</text><rect x="40" y="84" width="560" height="60" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="320" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿Necesitas paquetes que no son de Python (CUDA, GDAL)?</text><line x1="604" y1="114" x2="690" y2="114" stroke="#ffc857" stroke-width="2.2" marker-end="url(#fffc857)"/><rect x="628.0" y="80" width="38" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="647" y="99" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">sí</text><rect x="694" y="92" width="346" height="44" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="867" y="120" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">pixi (o conda)</text><line x1="320" y1="148" x2="320" y2="188" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="337.0" y="154" width="38" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="356" y="173" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">no</text><rect x="40" y="194" width="560" height="60" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="320" y="230" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿El proyecto ya usa poetry, pdm o hatch?</text><line x1="604" y1="224" x2="690" y2="224" stroke="#ffc857" stroke-width="2.2" marker-end="url(#fffc857)"/><rect x="628.0" y="190" width="38" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="647" y="209" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"