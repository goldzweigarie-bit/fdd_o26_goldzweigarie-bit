<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Las cinco etapas del Dockerfile de la entrega, apiladas en orden: una imagen base que ya trae Python; el binario de uv, copiado de su imagen oficial; los dos archivos que describen el ambiente; crear el ambiente desde el lock, sin dejar que cambie; y al final el programa. Una llave junto a la tercera y la cuarta dice que esa capa queda en cache y solo se rehace si cambia el lock; junto a la quinta, que cambia cada vez que editas el codigo. Abajo, en rojo: el .venv de tu maquina se queda fuera de la imagen"><rect x="0" y="0" width="1080" height="520" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El ambiente primero, el código al final</text><rect x="40" y="80" width="640" height="52" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="60" y="112" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">1 · una imagen base que ya trae Python</text><rect x="40" y="146" width="640" height="52" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="60" y="178" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">2 · el binario de uv, de su imagen oficial</text><rect x="40" y="212" width="640" height="52" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="60" y="244" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3 · los dos archivos que describen el ambiente</text><rect x="40" y="278" width="640" height="52" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="60" y="310" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">4 · crear el ambiente desde el lock, sin dejar que cambie</text><rect x="40" y="344" width="640" height="52" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="60" y="376" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">5 · el programa</text><path d="M 700 214 Q 716 214 716 230 L 716 316 Q 716 332 700 332" fill="none" stroke="#6fd8e8" stroke-width="2"/><text x="732" y="262" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">capa en caché:</text><text x="732" y="284" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">sólo se rehace si cambia el lock</text><text x="700" y="380" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">← cambia cada vez que editas el código</text><rect x="40" y="430" width="1000" height="56" rx="10" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="60" y="464" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="start">.venv/</text><text x="130" y="464" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de tu máquina: nunca entra a la imagen</text></svg>