content:
  title: "DataCamp: Introduction to Docker"
  instructions: >-
    Termina el curso Introduction to Docker de DataCamp y sube la evidencia por
    el flujo del curso. El enlace está abajo, en los recursos. Entras con la
    cuenta del grupo de DataCamp del ITAM, la misma de la primera semana. Los
    cursos son de la versión de paga: si perdiste el acceso, dilo antes del
    viernes 18, porque sin él se te van treinta de los cuarenta puntos de esta
    unidad y recuperarlo no es inmediato.
    Este curso hace lo que una clase de una hora no puede: te pone a teclear
    docker run, docker build y un Dockerfile completo, y te corrige al momento.
    La sesión del martes 22 da por tecleado lo que este curso entrena, así que
    hacerlo antes no es un trámite, es lo que hace que esa clase te sirva. Son
    dos cursos de Docker en todo el mes, no tres; éste es el primero.
    La entrega va en una carpeta llamada docker, dentro de tu carpeta de
    estudiante, y ojo con esto porque es el error que más se repite: es docker,
    no github. La de github es la de las certificaciones de la unidad pasada y
    ya está cerrada. Como todo en este curso, tu carpeta docker es un espejo de
    la que publiqué en codigo, así que se copia desde la terminal con el comando
    de siempre, con la barra y el punto al final del origen, y no se crea a mano
    ni se arrastra en el explorador de archivos.
    Para esta entrega deben quedar dos archivos. El primero es certificaciones
    punto md, que es la plantilla que copiaste, con la sección de Introduction to
    Docker llena: la fecha en que lo terminaste y la URL del Statement of
    Accomplishment, que es la que se verifica en un clic. Las otras tres secciones
    del archivo las dejas vacías: dos son para las dos entregas siguientes, y la
    última, la de algo que aprendiste y no sabías, se llena hasta la tercera. El
    segundo archivo es la captura, llamada introduccion guion a guion docker
    punto png, con ese nombre exacto porque la plantilla ya la enlaza. Si te sale
    en jpg en vez de png no pasa nada, pero entonces corriges el enlace dentro
    del archivo.
    Sobre la captura: la que sirve es la de la página del curso ya terminado,
    donde se vea tu nombre y el cien por ciento completado. No sirve una foto del
    certificado suelto sin contexto, ni una donde no se distinga de qué curso se
    trata. Recorta lo que sobre, pero deja visible el nombre del curso.
    La entrega es un pull request desde su propia branch, que se llama tarea
    guion cero ocho guion datacamp guion intro, con ese nombre exacto y escrita
    así, sin acentos y en minúsculas, porque la revisión automática lo comprueba.
    La branch nace de main, actualizado contra el repositorio del curso. Vence el
    mismo día que la entrega de tu imagen, y aun así son dos entregas distintas:
    dos branches y dos pull requests, las dos nacidas de main y ninguna de la
    otra. Una branch por tarea, sin excepciones.
    Un pull request toca una sola subcarpeta tuya. Éste toca docker y nada más;
    si de paso le metes archivos de la otra entrega, la revisión lo rechaza, y
    tiene razón: sin esa regla los tres pull requests de DataCamp se pelearían
    por el mismo certificaciones punto md y el merge acabaría en conflicto.
    Sabrás que terminaste cuando el pull request esté abierto y su revisión esté
    en verde. Si sale roja, lee el mensaje, corrige y haz push a la misma branch;
    el pull request se actualiza solo y no hay que abrir otro. Y que quede claro
    qué significa el verde, porque no es lo que parece: la revisión comprueba que
    no rompiste las reglas del repositorio, es decir que todo lo que tocaste vive
    en tu carpeta, que la branch se llama como debe y que no subiste basura. No
    comprueba que existan los archivos que te pedí, ni qué dice cada uno, ni que
    hayas respetado la regla del espejo. Eso lo reviso yo.
    Los cursos se hacen, no se simulan: la captura es evidencia de que lo
    hiciste, no el objetivo. Si no alcanzaste a terminarlo, sube lo que sí
    completaste y dilo en el archivo. Reportar el pendiente cuenta como entrega;
    presumir un avance que no ocurrió, no.
