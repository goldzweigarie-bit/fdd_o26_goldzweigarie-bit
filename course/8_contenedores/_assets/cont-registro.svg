<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="790" viewBox="0 0 1340 790" role="img" aria-label="A la izquierda, el nombre de una imagen desarmado en sus cuatro piezas rotuladas registro, usuario, nombre y tag: lo que tecleas es ubuntu y lo que Docker entiende es docker.io diagonal library diagonal ubuntu dos puntos latest, con la aclaracion de que library no es un usuario sino el namespace reservado de las imagenes oficiales, donde no puedes hacer push, y el aviso de que los nombres van en minusculas siempre. A la derecha, el viaje de tu propia imagen: docker login, docker tag y docker push hacia el registro, y docker pull de vuelta desde otra maquina, con el digest sha256 colgando de la imagen como su nombre verdadero e inmutable, y el aviso de que la URL publica de la imagen no es la de administracion"><rect x="0" y="0" width="1340" height="790" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El nombre de una imagen es una dirección</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cuatro piezas, tres de ellas con valor por omisión — y el viaje de la tuya</text><line x1="680" y1="96" x2="680" y2="700" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="60" y="122" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">el nombre, desarmado</text><text x="60" y="156" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">lo que tecleas</text><text x="60" y="192" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" text-anchor="start">ubuntu</text><line x1="90" y1="208" x2="90" y2="246" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><text x="114" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">lo que Docker entiende</text><rect x="60" y="258" width="112" height="52" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="116.0" y="291" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">docker.io</text><text x="116.0" y="332" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">registro</text><text x="183" y="292" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">/</text><rect x="194" y="258" width="94" height="52" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="241.0" y="291" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">library</text><text x="241.0" y="332" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">usuario</text><text x="299" y="292" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">/</text><rect x="310" y="258" width="85" height="52" rx="8" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="352.5" y="291" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">ubuntu</text><text x="352.5" y="332" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">nombre</text><text x="406" y="292" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="middle">:</text><rect x="417" y="258" width="85" height="52" rx="8" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="459.5" y="291" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">latest</text><text x="459.5" y="332" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">tag</text><rect x="60" y="356" width="580" height="106" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="80" y="386" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">library no es un usuario</text><text x="80" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Es el namespace reservado de las imágenes oficiales.</text><text x="80" y="430" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Ahí no puedes hacer push: la tuya va a tu-usuario/nombre.</text><rect x="60" y="480" width="580" height="88" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="80" y="510" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">los nombres van en minúsculas, siempre</text><text x="80" y="538" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker.io/TuUsuario/Mi-Imagen</text><text x="324" y="538" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">→  invalid reference format</text><rect x="60" y="586" width="580" height="88" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="80" y="616" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">latest tampoco es «la más nueva»</text><text x="80" y="642" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Es sólo el tag por omisión, y se mueve. Pinea un tag concreto.</text><text x="716" y="122" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">el viaje de tu propia imagen</text><rect x="716" y="146" width="260" height="88" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="846" y="176" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tu máquina</text><text x="846" y="202" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">mi-imagen:v1</text><text x="846" y="222" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">recién construida con docker build</text><line x1="846" y1="238" x2="846" y2="336" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><text x="880" y="266" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">docker login</text><text x="880" y="288" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">docker tag mi-imagen tu-usuario/mi-imagen:v1</text><text x="880" y="310" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">docker push tu-usuario/mi-imagen:v1</text><text x="880" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">sube sólo las capas que al registro le falten</text><rect x="716" y="344" width="584" height="130" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="1008" y="374" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el registro — Docker Hub</text><text x="1008" y="406" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">docker.io/tu-usuario/mi-imagen:v1</text><text x="1008" y="434" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">sha256:9b2fa1c0e7…</text><text x="1008" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el digest es su nombre verdadero: el tag se mueve, el digest no</text><line x1="846" y1="478" x2="846" y2="566" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><text x="880" y="514" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker pull tu-usuario/mi-imagen:v1</text><text x="880" y="534" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">otra máquina, sin tu código y sin tus dependencias</text><rect x="716" y="574" width="260" height="88" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="846" y="604" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">la máquina de alguien más</text><text x="846" y="628" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">no construyó nada:</text><text x="846" y="648" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sólo hizo pull</text><rect x="1010" y="574" width="290" height="88" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="1030" y="602" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">la URL pública no es la tuya</text><text x="1030" y="626" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">pública: hub.docker.com/r/tu-usuario/…</text><text x="1030" y="646" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">admin: hub.docker.com/repository/docker/…</text><text x="670" y="726" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Las tres piezas que no escribes tienen valor por omisión, y por eso ubuntu y docker.io/library/ubuntu:latest son la misma imagen.</text><text x="670" y="750" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Publicar no es «subirla a internet»: es darle un nombre que otra máquina pueda resolver. El digest es el que no miente.</text></svg>