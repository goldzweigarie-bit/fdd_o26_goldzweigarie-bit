<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Maquina de estados de tres casillas —created, running y exited— con cada transicion etiquetada por lo que la provoca: docker run, que es create mas start; docker start; la salida del proceso PID 1, que es la unica razon por la que un contenedor se detiene; y docker rm, que saca la casilla del dibujo junto con su capa de escritura. A la derecha, que alcanza cada comando: docker ps solo ve running, docker ps -a ve las tres, docker logs ve running y exited, y docker exec -it entra a running y aparece tachado contra exited. Al pie, el caso del exited con codigo 127: docker run --name roto ubuntu:24.04 sh -c comando-que-no-existe, cuya shell no encuentra el comando, y docker logs roto trae la linea sh: 1: comando-que-no-existe: not found"><rect x="0" y="0" width="1400" height="700" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="700" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El ciclo de vida de un contenedor</text><text x="700" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un contenedor vive exactamente lo que vive su proceso PID 1</text><line x1="60" y1="164" x2="480" y2="164" stroke="#6fd8e8" stroke-width="1.5"/><line x1="60" y1="164" x2="60" y2="178" stroke="#6fd8e8" stroke-width="1.5"/><line x1="480" y1="164" x2="480" y2="178" stroke="#6fd8e8" stroke-width="1.5"/><text x="270" y="152" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">docker run  =  create + start</text><rect x="60" y="220" width="180" height="96" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2.5"/><text x="150" y="262" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">created</text><text x="150" y="288" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">existe, y nunca corrió</text><rect x="300" y="220" width="180" height="96" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2.5"/><text x="390" y="262" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">running</text><text x="390" y="288" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">su PID 1 está vivo</text><rect x="540" y="220" width="180" height="96" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2.5"/><text x="630" y="262" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">exited</text><text x="630" y="288" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">su PID 1 ya salió</text><line x1="246" y1="268" x2="294" y2="268" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="196.0" y="182" width="148" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="270" y="201" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">docker start</text><line x1="486" y1="268" x2="534" y2="268" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><rect x="430.5" y="182" width="159" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="510" y="201" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">el PID 1 sale</text><path d="M 612 320 C 554.88 392, 465.12 392, 408 320" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="436.0" y="362" width="148" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="510" y="381" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">docker start</text><line x1="660" y1="320" x2="660" y2="424" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><text x="676" y="356" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker rm</text><rect x="500" y="428" width="260" height="76" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><text x="630" y="456" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">fuera del dibujo</text><text x="630" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">y con él, su capa de escritura</text><text x="60" y="348" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">Detenerse es siempre lo mismo:</text><text x="60" y="370" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">que el PID 1 salga. docker stop se lo pide</text><text x="60" y="388" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">con SIGTERM y espera 10 s; docker kill manda</text><text x="60" y="406" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">SIGKILL. No hay una tercera manera.</text><rect x="40" y="516" width="700" height="124" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="60" y="544" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">El caso que vas a ver: Exited (127)</text><text x="60" y="568" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">docker run --name roto ubuntu:24.04 sh -c comando-que-no-existe</text><text x="60" y="589" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">127 es «command not found»: la shell arrancó, no halló el comando y salió.</text><text x="60" y="607" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">docker ps no lo muestra; docker ps -a sí, y docker logs roto trae la línea:</text><text x="60" y="629" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sh: 1: comando-que-no-existe: not found</text><rect x="780" y="130" width="580" height="428" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="1070" y="160" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">qué alcanza cada comando</text><text x="802" y="186" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="start">docker ps</text><rect x="1002" y="170" width="104" height="34" rx="7" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.2"/><text x="1054.0" y="191.5" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">created</text><rect x="1118" y="170" width="104" height="34" rx="7" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="1170.0" y="191.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">running</text><rect x="1234" y="170" width="104" height="34" rx="7" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.2"/><text x="1286.0" y="191.5" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">exited</text><text x="802" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sólo lo que está corriendo</text><text x="802" y="276" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="start">docker ps -a</text><rect x="1002" y="260" width="104" height="34" rx="7" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="1054.0" y="281.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">created</text><rect x="1118" y="260" width="104" height="34" rx="7" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="1170.0" y="281.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">running</text><rect x="1234" y="260" width="104" height="34" rx="7" fill="#16302a" stroke="#ff8a7a" stroke-width="2"/><text x="1286.0" y="281.5" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">exited</text><text x="802" y="320" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">las tres: created y exited también</text><text x="802" y="366" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="start">docker logs</text><rect x="1002" y="350" width="104" height="34" rx="7" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.2"/><text x="1054.0" y="371.5" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">created</text><rect x="1118" y="350" width="104" height="34" rx="7" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="1170.0" y="371.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">running</text><rect x="1234" y="350" width="104" height="34" rx="7" fill="#16302a" stroke="#ff8a7a" stroke-width="2"/><text x="1286.0" y="371.5" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">exited</text><text x="802" y="410" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo que escribió ese proceso, vivo o muerto</text><text x="802" y="456" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="start">docker exec -it</text><rect x="1002" y="440" width="104" height="34" rx="7" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.2"/><text x="1054.0" y="461.5" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">created</text><rect x="1118" y="440" width="104" height="34" rx="7" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="1170.0" y="461.5" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">running</text><rect x="1234" y="440" width="104" height="34" rx="7" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.2"/><text x="1286.0" y="461.5" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">exited</text><text x="802" y="500" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sólo se entra a un proceso vivo</text><line x1="1170" y1="502" x2="1170" y2="478" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><line x1="1242" y1="458" x2="1330" y2="458" stroke="#ff8a7a" stroke-width="2.5"/><text x="700" y="668" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Nada de esto es una regla aparte: created es antes del primer arranque, exited es después de que su PID 1 salió, y docker rm borra la casilla entera.</text></svg>