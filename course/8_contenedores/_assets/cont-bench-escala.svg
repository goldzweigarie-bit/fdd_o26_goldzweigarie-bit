3.5" font-weight="normal" text-anchor="middle">contenedores</text><rect x="50.0" y="462.0" width="960.0" height="112.0" rx="10" fill="#141b20"/><text x="72" y="490" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Esto es la medición cruda, y por eso parece que Podman cruza a Docker.</text><text x="72" y="516" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">El script mide sólo el RSS de dockerd: nunca cuenta los containerd-shim, uno por contenedor.</text><text x="72" y="538" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">En Podman suma el RSS de todos los conmon, que comparten páginas entre sí.</text><text x="72" y="560" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">La gráfica dibuja el CSV tal cual: corregirla es el ejercicio de la página.</text><text x="530.0" y="592" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Intel Core i7-7700HQ · Linux 6.12 · Docker 28.4.0 · Podman 4.6.2 · imagen ubuntu, contenedores «sleep 3600» · una medición por punto</text></svg>