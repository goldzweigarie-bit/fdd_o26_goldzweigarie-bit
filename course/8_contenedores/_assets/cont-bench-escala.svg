t-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Qué cambia al pasar de 1 a 20 contenedores</text><text x="530.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Lo que midió el script, con el daemon de Docker y los conmon de Podman. Sin corregir nada.</text><text x="305.0" y="136" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Tiempo de arranque (segundos)</text><line x1="110.0" y1="164.0" x2="110.0" y2="400.0" stroke="#4a7a63" stroke-width="1.8"/><line x1="104.0" y1="400.0" x2="110.0" y2="400.0" stroke="#4a7a63" stroke-width="1.4"/><text x="98" y="404.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">0</text><line x1="104.0" y1="361.7" x2="110.0" y2="361.7" stroke="#4a7a63" stroke-width="1.4"/><text x="98" y="365.6666666666667" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">1</text><line x1="110.0" y1="361.7" x2="506.0" y2="361.7" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="104.0" y1="323.3" x2="110.0" y2="323.3" stroke="#4a7a63" stroke-width="1.4"/><text x="98" y="327.33333333333337" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">2</text><line x1="110.0" y1="323.3" x2="506.0" y2="323.3" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="104.0" y1="285.0" x2="110.0" y2="285.0" stroke="#4a7a63" stroke-width="1.4"/><text x="98" y="289.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">3</text><line x1="110.0" y1="285.0" x2="506.0" y2="285.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="104.0" y1="246.7" x2="110.0" y2="246.7" stroke="#4a7a63" stroke-width="1.4"/><text x="98" y="250.66666666666669" fill="