l="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">429.8 ms</text><rect x="250.0" y="195.0" width="504.3" height="30.0" rx="3" fill="#ffc857"/><text x="236" y="215" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Podman · ubuntu:24.04</text><text x="766.3275005275091" y="215" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">212.7 ms</text><rect x="250.0" y="241.0" width="495.3" height="30.0" rx="3" fill="#ffc857"/><text x="236" y="261" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Podman · alpine</text><text x="757.3331957326498" y="261" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">193.3 ms</text><rect x="250.0" y="287.0" width="57.1" height="30.0" rx="3" fill="#7ef29d"/><text x="236" y="307" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">a pelo · fork + execve</text><text x="319.1211481940901" y="307" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">1.8 ms</text><line x1="244.0" y1="330.0" x2="906.0" y2="330.0" stroke="#4a7a63" stroke-width="1.8"/><line x1="250.0" y1="330.0" x2="250.0" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="250.0" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">1</text><line x1="315.2" y1="330.0" x2="315.2" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="315.2231657271959" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">2</text><line x1="401.4" y1="330.0" x2="401.4" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="401.44350093947077" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">5</text><line x1="466.7" y1="330.0" x2="466.7" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="466.66666666666663" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">10</text><line x1="531.9" y1="330.0" x2="531.9" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="531.8898323938627" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">20</text><line x1="618.1" y1="330.0" x2="618.1" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="618.1101676061373" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">50</text><line x1="683.3" y1="330.0" x2="683.3" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="683.3333333333333" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">100</text><line x1="748.6" y1="330.0" x2="748.6" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="748.5564990605293" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">200</text><line x1="834.8" y1="330.0" x2="834.8" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="834.7768342728041" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">500</text><line x1="900.0" y1="330.0" x2="900.0" y2="336.0" stroke="#4a7a63" stroke-width="1.4"/><text x="900.0" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">1000</text><text x="575.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">milisegundos (escala logarítmica)</text><rect x="50.0" y="386.0" width="900.0" height="130.0" rx="10" fill="#141b20"/><text x="72" y="414" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Cambiar de imagen no cambia el arranque.</text><text x="72" y="440" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Docker tarda 427.6 ms con ubuntu:24.04 y 429.8 ms con alpine: 0.5 % de diferencia.</text><text x="72" y="462" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Arrancar no descomprime nada: la imagen ya quedó desplegada en el disco desde el pull.</text><text x="72" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">El baseline no es el piso del cronómetro: es el fork más execve de /usr/bin/date.</text><text x="72" y="506" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Su mediana es 1.8 ms; su media, 3.1 ms, por el ramp-up de frecuencia del CPU en las primeras repeticiones.</text><text x="500.0" y="542" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Intel Core i7-7700HQ · Linux 6.12 · Docker 28.4.0 · Podman 4.6.2</text><text x="500.0" y="559" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Imágenes ubuntu:24.04 y alpine · 10 repeticiones por barra más un warm-up descartado</text></svg>