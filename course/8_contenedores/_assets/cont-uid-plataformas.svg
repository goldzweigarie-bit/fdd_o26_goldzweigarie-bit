<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="830" viewBox="0 0 1340 830" role="img" aria-label="Cuatro plataformas en cuatro paneles y, en cada uno, de quien queda el archivo que el contenedor acaba de escribir en el bind mount. Linux nativo con Docker: queda de root, porque Docker no activa user namespaces y el uid 0 de adentro es el uid 0 de afuera. Linux con Podman rootless: queda de tu usuario, porque el uid 0 se mapea al tuyo y solo ese. WSL2 en una ruta ext4 de tu carpeta personal: queda de root, igual que en Linux, porque es Linux de verdad. Y macOS con Docker Desktop o Windows con una ruta del disco de Windows: queda de tu usuario, porque el filesystem compartido de la maquina virtual inventa la propiedad. Cada panel dibuja la frontera que explica su resultado, y al pie van las salidas: --user en Docker con su asterisco, y --userns=keep-id o el sufijo dos puntos U del volumen en Podman"><rect x="0" y="0" width="1340" height="830" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">De quién queda el archivo que escribe el contenedor</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el mismo bind mount y el mismo proceso, en cuatro plataformas — y cuatro resultados, no dos</text><rect x="40" y="110" width="305" height="486" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="192" y="142" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linux nativo</text><text x="192" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Docker</text><line x1="58" y1="178" x2="327" y2="178" stroke="#4a7a63" stroke-width="1"/><rect x="64" y="194" width="257" height="62" rx="8" fill="#16302a" stroke="#4a7a63" stroke-width="1.5"/><text x="192" y="218" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el proceso del contenedor</text><text x="192" y="242" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">uid 0  (root adentro)</text><line x1="192" y1="258" x2="192" y2="288" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="56" y="292" width="273" height="122" rx="10" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="7 7"/><text x="192" y="314" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">no hay user namespace</text><text x="192" y="338" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Docker no lo activa por omisión.</text><text x="192" y="356" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">El uid 0 de adentro es el uid 0</text><text x="192" y="374" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">de afuera: el mismo número, el</text><text x="192" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">mismo kernel, el mismo inodo.</text><line x1="192" y1="416" x2="192" y2="446" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="64" y="450" width="257" height="66" rx="8" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.5"/><text x="192" y="476" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">-rw-r--r-- 1 root root</text><text x="192" y="496" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">app/salida.txt</text><text x="192" y="550" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">queda de root</text><text x="192" y="576" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">y no lo borras sin sudo</text><rect x="360" y="110" width="305" height="486" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="512" y="142" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Linux</text><text x="512" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Podman rootless</text><line x1="378" y1="178" x2="647" y2="178" stroke="#4a7a63" stroke-width="1"/><rect x="384" y="194" width="257" height="62" rx="8" fill="#16302a" stroke="#4a7a63" stroke-width="1.5"/><text x="512" y="218" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el proceso del contenedor</text><text x="512" y="242" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">uid 0  (root adentro)</text><line x1="512" y1="258" x2="512" y2="288" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="376" y="292" width="273" height="122" rx="10" fill="none" stroke="#7ef29d" stroke-width="2" stroke-dasharray="7 7"/><text x="512" y="314" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">user namespace, con tu mapeo</text><text x="512" y="338" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">El uid 0 de adentro se mapea a TU</text><text x="512" y="356" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">uid. Sólo ése: el 1000 de adentro</text><text x="512" y="374" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">cae en tu rango de /etc/subuid,</text><text x="512" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">que no es ningún usuario real.</text><line x1="512" y1="416" x2="512" y2="446" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="384" y="450" width="257" height="66" rx="8" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.5"/><text x="512" y="476" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">-rw-r--r-- 1 tu tu</text><text x="512" y="496" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">app/salida.txt</text><text x="512" y="550" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">queda tuyo</text><text x="512" y="576" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">sin sudo en ningún momento</text><rect x="680" y="110" width="305" height="486" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="832" y="142" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">WSL2</text><text x="832" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">ruta ext4, en tu home de Linux</text><line x1="698" y1="178" x2="967" y2="178" stroke="#4a7a63" stroke-width="1"/><rect x="704" y="194" width="257" height="62" rx="8" fill="#16302a" stroke="#4a7a63" stroke-width="1.5"/><text x="832" y="218" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el proceso del contenedor</text><text x="832" y="242" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">uid 0  (root adentro)</text><line x1="832" y1="258" x2="832" y2="288" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="696" y="292" width="273" height="122" rx="10" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="7 7"/><text x="832" y="314" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">es Linux de verdad</text><text x="832" y="338" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Mismo kernel, mismo ext4, mismas</text><text x="832" y="356" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">reglas: se comporta igual que el</text><text x="832" y="374" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">primer panel. Guardar el proyecto</text><text x="832" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">en /mnt/c es otra historia.</text><line x1="832" y1="416" x2="832" y2="446" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="704" y="450" width="257" height="66" rx="8" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.5"/><text x="832" y="476" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">-rw-r--r-- 1 root root</text><text x="832" y="496" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">app/salida.txt</text><text x="832" y="550" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">queda de root</text><text x="832" y="576" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">es el caso 1, con otro nombre</text><rect x="1000" y="110" width="305" height="486" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="1152" y="142" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">macOS o Windows</text><text x="1152" y="164" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">ruta del disco de Windows o de macOS</text><line x1="1018" y1="178" x2="1287" y2="178" stroke="#4a7a63" stroke-width="1"/><rect x="1024" y="194" width="257" height="62" rx="8" fill="#16302a" stroke="#4a7a63" stroke-width="1.5"/><text x="1152" y="218" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el proceso del contenedor</text><text x="1152" y="242" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">uid 0  (root adentro)</text><line x1="1152" y1="258" x2="1152" y2="288" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="1016" y="292" width="273" height="122" rx="10" fill="none" stroke="#7ef29d" stroke-width="2" stroke-dasharray="7 7"/><text x="1152" y="314" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">el filesystem compartido lo inventa</text><text x="1152" y="338" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">El bind mount cruza a la VM por un</text><text x="1152" y="356" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">puente que traduce la propiedad:</text><text x="1152" y="374" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">te devuelve tu uid pase lo que</text><text x="1152" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">pase adentro. No lo negocia nadie.</text><line x1="1152" y1="416" x2="1152" y2="446" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="1024" y="450" width="257" height="66" rx="8" fill="#0b0f12" stroke="#4a7a63" stroke-width="1.5"/><text x="1152" y="476" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">-rw-r--r-- 1 tu staff</text><text x="1152" y="496" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">app/salida.txt</text><text x="1152" y="550" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">queda tuyo</text><text x="1152" y="576" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">no porque esté bien: nadie lo mide</text><text x="670" y="638" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">las salidas, cuando el resultado no te sirve</text><rect x="40" y="656" width="630" height="128" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="60" y="686" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">en Docker</text><text x="180" y="686" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker run --user $(id -u):$(id -g) …</text><text x="468" y="682" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="start">*</text><text x="60" y="714" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">* el proceso deja de ser root DENTRO también: si la imagen esperaba escribir</text><text x="60" y="734" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">en /app o instalar un paquete al arrancar, se rompe. Y ese uid no existe en el</text><text x="60" y="754" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">/etc/passwd de la imagen, así que algunas herramientas se quejan del usuario.</text><rect x="690" y="656" width="630" height="128" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="710" y="686" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">en Podman</text><text x="830" y="686" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">--userns=keep-id</text><text x="985" y="686" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">o bien</text><text x="1040" y="686" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">-v ./app:/app:U</text><text x="710" y="714" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">keep-id mapea tu uid al mismo número adentro, y ya no hay traducción que</text><text x="710" y="734" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sorprenda. El sufijo :U es otra cosa: hace un chown recursivo del origen al uid</text><text x="710" y="754" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">mapeado — cámbiale el dueño a tu directorio de verdad, así que mídelo antes.</text><text x="670" y="812" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">No son dos casos con excepciones: son cuatro respuestas distintas, y cuál te toca depende de dónde corre el kernel y de quién inventa la propiedad.</text></svg>