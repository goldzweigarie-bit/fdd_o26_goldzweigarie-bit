<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="730" viewBox="0 0 1320 730" role="img" aria-label="Tabla de diagnostico de tres columnas —sintoma, causa y arreglo— con las cinco trampas de instalacion: los bind mounts que fallan fuera de tu carpeta personal porque el paquete de snap esta confinado, la distro corriendo en WSL1 en vez de WSL2, la integracion por distro apagada en Docker Desktop, la virtualizacion desactivada en el firmware, y el disco lleno que delata df -h barra. Una sexta fila va tachada y en gris: Secure Boot no tiene nada que ver con Docker y no hay que apagarlo por esto. Al pie, la fecha de reporte anticipada: si el sabado 19 no te funciona, dilo el sabado 19, no el lunes a medianoche"><rect x="0" y="0" width="1320" height="730" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="660" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Planes B: qué hacer cuando la instalación no salió</text><text x="660" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las cinco trampas que se repiten, con el síntoma exacto que las delata</text><text x="66" y="116" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">síntoma</text><text x="446" y="116" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">causa</text><text x="866" y="116" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">arreglo</text><line x1="50" y1="128" x2="1270" y2="128" stroke="#4a7a63" stroke-width="1.5"/><rect x="50" y="140" width="1220" height="78" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><line x1="430" y1="150" x2="430" y2="208" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="150" x2="850" y2="208" stroke="#4a7a63" stroke-width="1"/><text x="66" y="174" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">bind mount fuera de tu home:</text><text x="66" y="196" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">no such file or directory</text><text x="446" y="174" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">instalaste Docker desde snap y el paquete</text><text x="446" y="196" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">está confinado: no ve fuera de tu home</text><text x="866" y="174" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">desinstala el snap e instala desde el</text><text x="866" y="196" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">repositorio oficial de Docker</text><rect x="50" y="226" width="1220" height="78" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><line x1="430" y1="236" x2="430" y2="294" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="236" x2="850" y2="294" stroke="#4a7a63" stroke-width="1"/><text x="66" y="260" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">System has not been booted with systemd</text><text x="66" y="282" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">y el servicio de docker no arranca</text><text x="446" y="260" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">tu distro corre en WSL1, no en WSL2</text><text x="866" y="260" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">wsl -l -v para verlo, y luego</text><text x="866" y="282" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">wsl --set-version &lt;distro&gt; 2</text><rect x="50" y="312" width="1220" height="78" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><line x1="430" y1="322" x2="430" y2="380" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="322" x2="850" y2="380" stroke="#4a7a63" stroke-width="1"/><text x="66" y="346" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker existe en PowerShell</text><text x="66" y="368" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">y no existe en la terminal de Ubuntu</text><text x="446" y="346" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la integración por distro está apagada</text><text x="446" y="368" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">en Docker Desktop</text><text x="866" y="346" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Settings → Resources → WSL integration,</text><text x="866" y="368" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y enciende tu distro</text><rect x="50" y="398" width="1220" height="78" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><line x1="430" y1="408" x2="430" y2="466" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="408" x2="850" y2="466" stroke="#4a7a63" stroke-width="1"/><text x="66" y="432" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">WSL2 o Docker Desktop no levantan:</text><text x="66" y="454" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">la máquina virtual nunca arranca</text><text x="446" y="432" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la virtualización está desactivada</text><text x="446" y="454" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">en el firmware de la máquina</text><text x="866" y="432" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">enciéndela en la BIOS/UEFI:</text><text x="866" y="454" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">VT-x, AMD-V o SVM Mode</text><rect x="50" y="484" width="1220" height="78" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><line x1="430" y1="494" x2="430" y2="552" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="494" x2="850" y2="552" stroke="#4a7a63" stroke-width="1"/><text x="66" y="518" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">no space left on device</text><text x="66" y="540" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">a media descarga de la imagen</text><text x="446" y="518" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el disco está lleno:</text><text x="446" y="540" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">df -h / lo delata en una línea</text><text x="866" y="518" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">docker system df y después prune:</text><text x="866" y="540" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la página 8 dice qué se lleva cada uno</text><rect x="50" y="570" width="1220" height="78" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><line x1="430" y1="580" x2="430" y2="638" stroke="#4a7a63" stroke-width="1"/><line x1="850" y1="580" x2="850" y2="638" stroke="#4a7a63" stroke-width="1"/><text x="66" y="604" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">Secure Boot está encendido</text><line x1="64" y1="600" x2="262" y2="600" stroke="#a7b8ad" stroke-width="2"/><text x="446" y="604" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ninguna: no es una causa</text><text x="866" y="604" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no tiene nada que ver con Docker;</text><text x="866" y="626" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">no lo apagues por esto</text><text x="660" y="684" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La fecha de reporte va anticipada a propósito: si el sábado 19 no te funciona, dilo el sábado 19.</text><text x="660" y="708" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">No el lunes a medianoche, con la clase del martes encima.</text></svg>