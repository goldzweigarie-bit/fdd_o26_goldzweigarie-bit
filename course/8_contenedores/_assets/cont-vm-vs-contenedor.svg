<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-label="Dos pilas lado a lado sobre el mismo hardware y el mismo kernel del host. A la izquierda, el hipervisor y tres maquinas virtuales, cada una con su kernel invitado y su sistema operativo completo; a la derecha, tres contenedores que comparten el kernel del host y solo llevan su rootfs y su proceso. La frontera del aislamiento va resaltada en cada pila y una franja al pie compara arranque, tamano en disco y que le pasa a cada pila con un bug del kernel"><rect x="0" y="0" width="1180" height="820" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="590" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Máquina virtual contra contenedor</text><text x="590" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">dónde ocurre el aislamiento</text><text x="310" y="104" fill="#ffc857" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tres máquinas virtuales</text><text x="870" y="104" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">tres contenedores</text><rect x="60" y="140" width="156" height="270" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="138" y="164" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">VM</text><rect x="72" y="176" width="132" height="46" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="138" y="204" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="72" y="230" width="132" height="92" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="138" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">sistema operativo</text><text x="138" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">completo</text><text x="138" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">init, libs, paquetes</text><rect x="72" y="330" width="132" height="66" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.5"/><text x="138" y="358" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">kernel</text><text x="138" y="378" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">invitado</text><rect x="232" y="140" width="156" height="270" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="310" y="164" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">VM</text><rect x="244" y="176" width="132" height="46" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="310" y="204" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="244" y="230" width="132" height="92" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="310" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">sistema operativo</text><text x="310" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">completo</text><text x="310" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">init, libs, paquetes</text><rect x="244" y="330" width="132" height="66" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.5"/><text x="310" y="358" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">kernel</text><text x="310" y="378" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">invitado</text><rect x="404" y="140" width="156" height="270" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="482" y="164" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">VM</text><rect x="416" y="176" width="132" height="46" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="482" y="204" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="416" y="230" width="132" height="92" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="482" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">sistema operativo</text><text x="482" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">completo</text><text x="482" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">init, libs, paquetes</text><rect x="416" y="330" width="132" height="66" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.5"/><text x="482" y="358" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">kernel</text><text x="482" y="378" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">invitado</text><rect x="60" y="428" width="500" height="66" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="3.5"/><text x="310" y="456" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">hipervisor (KVM, QEMU, Hyper-V)</text><text x="310" y="478" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la frontera del aislamiento está aquí</text><rect x="620" y="150" width="500" height="156" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><text x="870" y="186" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">lo que el contenedor NO lleva</text><text x="870" y="216" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">· ningún kernel invitado</text><text x="870" y="240" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">· ningún sistema operativo completo</text><text x="870" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">· ningún hipervisor</text><text x="870" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">por eso arranca en milisegundos y pesa megabytes</text><rect x="620" y="330" width="156" height="164" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="698" y="354" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">contenedor</text><rect x="632" y="366" width="132" height="54" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="698" y="398" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="632" y="428" width="132" height="54" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="698" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">rootfs</text><text x="698" y="468" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sólo lo que pediste</text><rect x="792" y="330" width="156" height="164" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="870" y="354" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">contenedor</text><rect x="804" y="366" width="132" height="54" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="870" y="398" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="804" y="428" width="132" height="54" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="870" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">rootfs</text><text x="870" y="468" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sólo lo que pediste</text><rect x="964" y="330" width="156" height="164" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="1042" y="354" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">contenedor</text><rect x="976" y="366" width="132" height="54" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="1042" y="398" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu proceso</text><rect x="976" y="428" width="132" height="54" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.5"/><text x="1042" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">rootfs</text><text x="1042" y="468" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sólo lo que pediste</text><rect x="60" y="508" width="1060" height="62" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="3.5"/><text x="590" y="534" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">kernel del host (Linux) — uno solo</text><text x="590" y="558" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">del lado del contenedor la frontera está aquí: es el mismo kernel para los tres</text><rect x="60" y="584" width="1060" height="50" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="590" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">hardware — CPU, memoria, disco, red</text><rect x="40" y="656" width="1100" height="136" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="360" y="684" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">máquina virtual</text><text x="760" y="684" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">contenedor</text><text x="70" y="716" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">arranque</text><text x="360" y="716" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">decenas de segundos</text><text x="760" y="716" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cientos de milisegundos</text><text x="70" y="744" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">tamaño en disco</text><text x="360" y="744" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">gigabytes</text><text x="760" y="744" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">decenas o cientos de MB</text><text x="70" y="772" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">un bug del kernel</text><text x="360" y="772" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cae el invitado; el host sigue</text><text x="760" y="772" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cae el kernel de todos: no hay un segundo kernel</text></svg>