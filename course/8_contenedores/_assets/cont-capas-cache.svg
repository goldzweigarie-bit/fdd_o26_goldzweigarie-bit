<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-label="Un Dockerfile a la izquierda y su pila de capas a la derecha, cada capa con su hash truncado. Arriba, con COPY punto punto antes del RUN pip install, tocar una linea de codigo invalida esa capa y todas las de abajo, que caen en domino aunque su contenido no haya cambiado. Abajo, con COPY requirements.txt primero y el codigo despues, las capas de instalacion quedan rotuladas CACHED y solo se rehacen las dos ultimas"><rect x="0" y="0" width="1300" height="760" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="650" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El caché de capas cae en dominó</text><text x="650" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el mismo cambio en una línea de código, con dos Dockerfiles</text><text x="50" y="104" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">mal ordenado</text><text x="200" y="104" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">COPY . .  antes del  RUN pip install</text><rect x="50" y="124" width="560" height="220" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><rect x="58" y="144" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="165" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">FROM python:3.12-slim</text><line x1="616" y1="160" x2="684" y2="160" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="144" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="165" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:6a2f…</text><text x="910" y="165" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 1</text><text x="1116" y="165" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="182" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="203" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">WORKDIR /app</text><line x1="616" y1="198" x2="684" y2="198" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="182" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="203" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:c81d…</text><text x="910" y="203" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 2</text><text x="1116" y="203" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="220" width="544" height="32" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="72" y="241" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">COPY . .</text><text x="596" y="241" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="end">← tocaste una línea</text><line x1="616" y1="236" x2="684" y2="236" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="220" width="440" height="32" rx="6" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="704" y="241" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:4be9…</text><text x="910" y="241" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 3</text><text x="1116" y="241" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">INVALIDADA</text><rect x="58" y="258" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="279" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">RUN pip install -r requirements.txt</text><line x1="616" y1="274" x2="684" y2="274" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="258" width="440" height="32" rx="6" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="704" y="279" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:07ac…</text><text x="910" y="279" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 4</text><text x="1116" y="279" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">INVALIDADA</text><rect x="58" y="296" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="317" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">CMD ["python", "app.py"]</text><line x1="616" y1="312" x2="684" y2="312" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="296" width="440" height="32" rx="6" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="704" y="317" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:d5f1…</text><text x="910" y="317" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 5</text><text x="1116" y="317" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">INVALIDADA</text><line x1="1168" y1="236" x2="1168" y2="324" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><text x="1184" y="262" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">caen</text><text x="1184" y="280" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">en dominó</text><text x="1184" y="302" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">pip vuelve a</text><text x="1184" y="316" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">correr entero,</text><text x="1184" y="330" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">sin haber</text><text x="1184" y="344" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">cambiado nada</text><line x1="40" y1="368" x2="1260" y2="368" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="50" y="400" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">bien ordenado</text><text x="200" y="400" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">COPY requirements.txt .  antes, y el código después</text><text x="580" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">— reordenar parte el COPY en dos: una instrucción más</text><rect x="50" y="420" width="560" height="258" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><rect x="58" y="440" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="461" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">FROM python:3.12-slim</text><line x1="616" y1="456" x2="684" y2="456" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="440" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="461" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:6a2f…</text><text x="910" y="461" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 1</text><text x="1116" y="461" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="478" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="499" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">WORKDIR /app</text><line x1="616" y1="494" x2="684" y2="494" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="478" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="499" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:c81d…</text><text x="910" y="499" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 2</text><text x="1116" y="499" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="516" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="537" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">COPY requirements.txt .</text><line x1="616" y1="532" x2="684" y2="532" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="516" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="537" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:9d30…</text><text x="910" y="537" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 3</text><text x="1116" y="537" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="554" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="575" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">RUN pip install -r requirements.txt</text><line x1="616" y1="570" x2="684" y2="570" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="554" width="440" height="32" rx="6" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="704" y="575" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:b17e…</text><text x="910" y="575" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 4</text><text x="1116" y="575" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">CACHED</text><rect x="58" y="592" width="544" height="32" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="72" y="613" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">COPY . .</text><text x="596" y="613" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="end">← tocaste una línea</text><line x1="616" y1="608" x2="684" y2="608" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="592" width="440" height="32" rx="6" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="704" y="613" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:4be9…</text><text x="910" y="613" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 5</text><text x="1116" y="613" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">INVALIDADA</text><rect x="58" y="630" width="544" height="32" rx="6" fill="#0b0f12" stroke="none" stroke-width="0"/><text x="72" y="651" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">CMD ["python", "app.py"]</text><line x1="616" y1="646" x2="684" y2="646" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><rect x="690" y="630" width="440" height="32" rx="6" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="704" y="651" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sha256:d5f1…</text><text x="910" y="651" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">capa 6</text><text x="1116" y="651" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">INVALIDADA</text><text x="1184" y="570" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">pip no vuelve</text><text x="1184" y="584" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">a correr</text><line x1="1168" y1="596" x2="1168" y2="658" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><text x="1184" y="614" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">sólo estas</text><text x="1184" y="632" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">dos se rehacen</text><text x="650" y="714" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El caché es secuencial: una capa sólo se reusa si TODAS las de arriba se reusaron. Por eso una capa invalidada tumba todo lo que sigue,</text><text x="650" y="738" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">aunque su propio contenido no haya cambiado. La regla práctica: lo que cambia poco, arriba; lo que cambia en cada commit, hasta abajo.</text></svg>