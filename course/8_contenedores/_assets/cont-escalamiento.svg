<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="870" viewBox="0 0 1220 870" role="img" aria-label="Dos escenarios. A la izquierda, una sola copia del servicio con su archivo de sesiones guardado adentro y funcionando. A la derecha, cinco replicas identicas de la misma imagen detras de un repartidor de carga, cada una con su propio archivo de sesiones marcado en rojo, y tres peticiones del mismo usuario que caen en replicas distintas y encuentran archivos distintos. Abajo, el mismo dibujo corregido: el estado sacado a una caja compartida fuera de los contenedores y el orquestador, que decide cuantas replicas hay y repone la que muere"><rect x="0" y="0" width="1220" height="870" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="610" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">De uno a mil: qué se rompe al escalar</text><text x="610" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el mismo servicio, una copia y cinco réplicas</text><text x="60" y="108" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">una copia</text><rect x="60" y="150" width="110" height="60" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="115" y="176" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">usuario</text><text x="115" y="194" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">una sesión</text><line x1="176" y1="180" x2="246" y2="180" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="252" y="130" width="280" height="150" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="392" y="158" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el servicio</text><text x="392" y="178" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">una sola copia</text><rect x="282" y="196" width="220" height="60" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="392" y="222" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">sesiones.db</text><text x="392" y="244" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">adentro del contenedor</text><text x="296" y="318" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Funciona. El usuario siempre vuelve</text><text x="296" y="338" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">al mismo proceso y al mismo archivo.</text><line x1="570" y1="130" x2="570" y2="460" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="600" y="108" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">cinco réplicas de la misma imagen</text><rect x="600" y="240" width="100" height="60" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="650" y="266" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el mismo</text><text x="650" y="284" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">usuario</text><line x1="706" y1="270" x2="724" y2="270" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="730" y="140" width="90" height="310" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="775" y="286" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">repartidor</text><text x="775" y="304" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">de carga</text><rect x="870" y="140" width="310" height="52" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="884" y="162" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplica 1</text><text x="1166" y="162" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="end">sesiones.db</text><text x="884" y="180" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">no te conoce: su archivo está vacío</text><rect x="870" y="204" width="310" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="884" y="226" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplica 2</text><text x="1166" y="226" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="end">sesiones.db</text><text x="884" y="244" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">su propio archivo, con otra cosa adentro</text><rect x="870" y="268" width="310" height="52" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="884" y="290" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplica 3</text><text x="1166" y="290" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="end">sesiones.db</text><text x="884" y="308" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">no te conoce: su archivo está vacío</text><rect x="870" y="332" width="310" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="884" y="354" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplica 4</text><text x="1166" y="354" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="end">sesiones.db</text><text x="884" y="372" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">su propio archivo, con otra cosa adentro</text><rect x="870" y="396" width="310" height="52" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="884" y="418" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplica 5</text><text x="1166" y="418" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="end">sesiones.db</text><text x="884" y="436" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">no te conoce: su archivo está vacío</text><line x1="824" y1="166" x2="864" y2="166" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="844" y="154" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">1ª</text><line x1="824" y1="294" x2="864" y2="294" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="844" y="282" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">2ª</text><line x1="824" y1="422" x2="864" y2="422" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="844" y="410" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">3ª</text><text x="890" y="494" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Cada petición cae en una réplica distinta y encuentra otro archivo.</text><text x="890" y="514" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">La sesión se pierde: el estado adentro rompe el escalamiento.</text><line x1="40" y1="548" x2="1180" y2="548" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="610" y="584" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">lo mismo, corregido</text><rect x="40" y="616" width="230" height="96" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="155" y="644" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el orquestador</text><text x="155" y="666" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">decide cuántas réplicas hay</text><text x="155" y="684" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">y repone la que muere</text><line x1="274" y1="656" x2="294" y2="656" stroke="#c9a7ff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#fc9a7ff)"/><rect x="300" y="616" width="152" height="80" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="376" y="644" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplica</text><text x="376" y="666" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sin estado</text><text x="376" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="376" y1="700" x2="505" y2="720" stroke="#6fd8e8" stroke-width="1.4" marker-end="url(#f6fd8e8)"/><rect x="482" y="616" width="152" height="80" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="558" y="644" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplica</text><text x="558" y="666" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sin estado</text><text x="558" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="558" y1="700" x2="593" y2="720" stroke="#6fd8e8" stroke-width="1.4" marker-end="url(#f6fd8e8)"/><rect x="664" y="616" width="152" height="80" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="740" y="644" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplica</text><text x="740" y="666" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sin estado</text><text x="740" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="740" y1="700" x2="681" y2="720" stroke="#6fd8e8" stroke-width="1.4" marker-end="url(#f6fd8e8)"/><rect x="846" y="616" width="152" height="80" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="922" y="644" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplica</text><text x="922" y="666" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sin estado</text><text x="922" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="922" y1="700" x2="769" y2="720" stroke="#6fd8e8" stroke-width="1.4" marker-end="url(#f6fd8e8)"/><rect x="1028" y="616" width="152" height="80" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="1104" y="644" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">réplica</text><text x="1104" y="666" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sin estado</text><text x="1104" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">desechable</text><line x1="1104" y1="700" x2="857" y2="720" stroke="#6fd8e8" stroke-width="1.4" marker-end="url(#f6fd8e8)"/><rect x="470" y="724" width="420" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="680" y="752" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el estado, afuera</text><text x="680" y="774" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">una base o un caché de sesiones, compartido por las cinco</text><text x="610" y="826" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Sacar el estado afuera es lo que hace intercambiables a las réplicas: matar una deja de ser un problema.</text><text x="610" y="848" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Quién decide cuántas hay y repone la que muere es el orquestador. Kubernetes es el nombre, y en este curso queda como deuda.</text></svg>