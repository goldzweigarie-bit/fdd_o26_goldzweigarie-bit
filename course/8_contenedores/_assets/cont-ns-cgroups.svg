<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-label="Un proceso partido en dos mitades. A la izquierda, bajo el rotulo que puede ver, seis cajas de namespace etiquetadas pid, net, mnt, user, uts e ipc, con cgroup y time al pie como los dos tipos que faltan para llegar a ocho. A la derecha, bajo cuanto puede usar, tres medidores de cgroup para CPU, memoria y numero de procesos. La caja user va resaltada y unida por una linea continua al kernel del host, porque es el unico de los diez enlaces que no difiere del host"><rect x="0" y="0" width="1180" height="700" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="590" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Namespaces y cgroups: dos preguntas distintas</text><text x="590" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no son dos mitades de lo mismo</text><rect x="40" y="92" width="1100" height="356" rx="10" fill="none" stroke="#4a7a63" stroke-width="2"/><text x="60" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">el proceso del contenedor</text><line x1="600" y1="100" x2="600" y2="440" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="320" y="152" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">qué puede VER</text><text x="320" y="174" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">namespaces</text><text x="870" y="152" fill="#ffc857" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">cuánto puede USAR</text><text x="870" y="174" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cgroups</text><rect x="60" y="196" width="160" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="140" y="224" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">pid</text><text x="140" y="246" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">qué procesos ve</text><rect x="240" y="196" width="160" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="320" y="224" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">net</text><text x="320" y="246" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">su propia red</text><rect x="420" y="196" width="160" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="500" y="224" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">mnt</text><text x="500" y="246" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">qué archivos ve</text><rect x="60" y="278" width="160" height="66" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="3"/><text x="140" y="306" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">user</text><text x="140" y="328" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">qué UID es adentro</text><rect x="240" y="278" width="160" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="320" y="306" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">uts</text><text x="320" y="328" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">su propio hostname</text><rect x="420" y="278" width="160" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="500" y="306" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">ipc</text><text x="500" y="328" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">memoria compartida</text><rect x="200" y="360" width="380" height="56" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><text x="212" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y dos tipos más, para ocho:</text><rect x="421.0" y="374" width="82" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="462" y="393" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">cgroup</text><rect x="518.0" y="374" width="60" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="548" y="393" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">time</text><text x="660" y="210" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">CPU</text><text x="1100" y="210" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">--cpus=0.5</text><rect x="660" y="220" width="440" height="24" rx="6" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><rect x="662.0" y="222.0" width="218.0" height="20.0" rx="5" fill="#ffc857"/><text x="660" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">ve todos los núcleos; sólo no puede usarlos todos</text><text x="660" y="290" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">memoria</text><text x="1100" y="290" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">--memory=512m</text><rect x="660" y="300" width="440" height="24" rx="6" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><rect x="662.0" y="302.0" width="152.6" height="20.0" rx="5" fill="#c9a7ff"/><text x="660" y="344" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">pasarse no da un error: da un OOM kill</text><text x="660" y="370" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">procesos</text><text x="1100" y="370" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">--pids-limit=100</text><rect x="660" y="380" width="440" height="24" rx="6" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><rect x="662.0" y="382.0" width="87.2" height="20.0" rx="5" fill="#6fd8e8"/><text x="660" y="424" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">el tope de PIDs: lo que frena una bomba de forks</text><line x1="140" y1="344" x2="140" y2="562" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><rect x="40" y="496" width="1100" height="56" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><text x="590" y="530" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">kernel del host — uno solo, compartido</text><rect x="40" y="566" width="520" height="60" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="300" y="590" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">user es el único de los diez enlaces que NO difiere del host</text><text x="300" y="610" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Docker no activa user namespaces por omisión: root adentro es root afuera</text><text x="590" y="656" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">ls /proc/1/ns/ imprime DIEZ enlaces y aquí hay OCHO tipos: pid y time salen además en su variante _for_children,</text><text x="590" y="678" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">el namespace que heredarán los hijos. De esos diez, nueve difieren del host.</text></svg>