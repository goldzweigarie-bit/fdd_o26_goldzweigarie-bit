<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="Grafica de barras del rendimiento de escritura en megabytes por segundo: el disco a pelo da 458, Docker escribe 380 en su capa overlay y 510 en un volumen, un 34 por ciento mas, y Podman escribe 512 en un volumen. La quinta barra, la de Podman sobre su capa overlay, dice 1700 y no se dibuja como las otras cuatro: va hueca, con el contorno punteado en rojo, se sale del eje y termina en un corte de sierra, porque 1700 es 3.7 veces el disco a pelo y lo que midio fue el page cache, no el disco"><rect x="0" y="0" width="1040" height="620" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="520.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Cuánto rinde escribir, y cuándo el número no es del disco</text><text x="520.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Mediana de 3 repeticiones · MB/s · cuatro mediciones y un artefacto, dibujados distinto a propósito</text><line x1="250.0" y1="104.0" x2="250.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="355.0" y1="104.0" x2="355.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="460.0" y1="104.0" x2="460.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="565.0" y1="104.0" x2="565.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="670.0" y1="104.0" x2="670.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="775.0" y1="104.0" x2="775.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="880.0" y1="104.0" x2="880.0" y2="345.0" stroke="#4a7a63" stroke-width="0.8" stroke-dasharray="3 6"/><line x1="730.9" y1="104.0" x2="730.9" y2="345.0" stroke="#7ef29d" stroke-width="1.2" stroke-dasharray="4 6"/><text x="730.9" y="96" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">el disco a pelo</text><rect x="250.0" y="115.0" width="480.9" height="30.0" rx="3" fill="#7ef29d"/><text x="236" y="135" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">a pelo · al disco</text><text x="742.9" y="135" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">458 MB/s</text><rect x="250.0" y="161.0" width="399.0" height="30.0" rx="3" fill="#6fd8e8"/><text x="236" y="181" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Docker · capa overlay</text><text x="661.0" y="181" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">380 MB/s</text><rect x="250.0" y="207.0" width="535.5" height="30.0" rx="3" fill="#6fd8e8"/><text x="236" y="227" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Docker · volumen</text><text x="797.5" y="227" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">510 MB/s</text><rect x="250.0" y="253.0" width="537.6" height="30.0" rx="3" fill="#ffc857"/><text x="236" y="273" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Podman · volumen</text><text x="799.6" y="273" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">512 MB/s</text><line x1="900.0" y1="176.0" x2="900.0" y2="222.0" stroke="#7ef29d" stroke-width="1.5"/><line x1="890.0" y1="176.0" x2="900.0" y2="176.0" stroke="#7ef29d" stroke-width="1.5"/><line x1="890.0" y1="222.0" x2="900.0" y2="222.0" stroke="#7ef29d" stroke-width="1.5"/><text x="910" y="204.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">+34 %</text><text x="236" y="319" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">Podman · capa overlay</text><path d="M 920.0 299.0 L 250.0 299.0 L 250.0 329.0 L 920.0 329.0" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="7 5"/><path d="M 920.0 299.0 L 908.0 306.5 L 932.0 314.0 L 908.0 321.5 L 920.0 329.0" fill="none" stroke="#ff8a7a" stroke-width="2"/><text x="268" y="319" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">1700 MB/s — esto no es una medición de disco</text><line x1="244.0" y1="356.0" x2="886.0" y2="356.0" stroke="#4a7a63" stroke-width="1.8"/><line x1="250.0" y1="356.0" x2="250.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="250.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">0</text><line x1="355.0" y1="356.0" x2="355.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="355.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">100</text><line x1="460.0" y1="356.0" x2="460.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="460.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">200</text><line x1="565.0" y1="356.0" x2="565.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="565.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">300</text><line x1="670.0" y1="356.0" x2="670.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="670.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">400</text><line x1="775.0" y1="356.0" x2="775.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="775.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">500</text><line x1="880.0" y1="356.0" x2="880.0" y2="362.0" stroke="#4a7a63" stroke-width="1.4"/><text x="880.0" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">600</text><text x="565.0" y="402" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">megabytes por segundo escritos</text><rect x="50.0" y="430.0" width="940.0" height="118.0" rx="10" fill="#141b20"/><text x="72" y="458" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Un resultado y un artefacto, en el mismo CSV.</text><text x="72" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Docker: en un volumen rinde 510 MB/s contra 380 en la capa overlay, 34 % más. Ése es el resultado, y es el que la unidad publica.</text><text x="72" y="506" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Podman sobre fuse-overlayfs reporta 1700 MB/s: 3.7× el disco a pelo. Nadie escribe más rápido que su disco.</text><text x="72" y="528" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Lo que midió ahí fue el page cache. Por eso esa barra va hueca, fuera del eje y rota: no es un dato que se pueda leer en la escala.</text><text x="520.0" y="566" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Intel Core i7-7700HQ · Linux 6.12 · Docker 28.4.0 · Podman 4.6.2</text><text x="520.0" y="583" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Tanda 1 · 3 repeticiones por brazo, mediana · de esta prueba se conservó el CSV, no el script que lo produjo</text></svg>