<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="No es una linea, son dos ejes cruzados. El eje horizontal, donde aterriza la syscall que no controlas, ordena proceso suelto, contenedor, gVisor, Kata y VM completa. El eje vertical, que privilegio tiene quien se escapa, va de root en el host abajo a un usuario sin privilegios con su rango de subuid arriba. Contenedor rootful y rootless caen en la misma columna y se separan solo en el eje vertical; gVisor aparece dos veces, una a cada altura, porque tiene su propio modo rootless: los ejes se componen, no se ordenan"><rect x="0" y="0" width="1200" height="800" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="600" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El aislamiento no es una línea: son dos ejes</text><text x="600" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y rootless sólo mueve uno de los dos</text><line x1="300" y1="566" x2="300" y2="174" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><line x1="294" y1="560" x2="1166" y2="560" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><line x1="300" y1="270" x2="1160" y2="270" stroke="#4a7a63" stroke-width="1" stroke-dasharray="4 7"/><line x1="300" y1="480" x2="1160" y2="480" stroke="#4a7a63" stroke-width="1" stroke-dasharray="4 7"/><text x="170" y="126" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">qué privilegio tiene</text><text x="170" y="146" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">quien se escapa</text><text x="730" y="126" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Son dos preguntas independientes. Cada runtime ocupa una casilla de la rejilla:</text><text x="730" y="148" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una respuesta en el eje de abajo y otra en el de la izquierda.</text><text x="288" y="264" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">un usuario sin privilegios,</text><text x="288" y="282" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">con su rango de subuid</text><text x="288" y="484" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">root en el host</text><text x="386" y="592" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">proceso suelto</text><text x="386" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la syscall va directo</text><text x="386" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">al kernel del host</text><text x="558" y="592" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">contenedor</text><text x="558" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la syscall va directo</text><text x="558" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">al kernel del host —</text><text x="558" y="646" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el mismo kernel</text><text x="730" y="592" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">gVisor</text><text x="730" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">a un núcleo en espacio</text><text x="730" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">de usuario que reimplementa</text><text x="730" y="646" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la interfaz de syscalls</text><text x="902" y="592" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Kata</text><text x="902" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">a un segundo kernel real,</text><text x="902" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">dentro de una VM ligera</text><text x="1074" y="592" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">VM completa</text><text x="1074" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">a un kernel invitado,</text><text x="1074" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">detrás del hipervisor</text><text x="730" y="700" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">dónde aterriza la syscall que no controlas   →</text><circle cx="386" cy="480" r="9" fill="#a7b8ad" stroke="none" stroke-width="2"/><text x="386" y="508" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">nada que romper</text><line x1="558" y1="462" x2="558" y2="290" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><text x="544" y="374" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">rootless</text><text x="544" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="end">sube sólo aquí</text><circle cx="558" cy="480" r="10" fill="#ff8a7a" stroke="none" stroke-width="2"/><text x="558" y="508" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">rootful</text><circle cx="558" cy="270" r="10" fill="#7ef29d" stroke="none" stroke-width="2"/><text x="558" y="246" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">rootless</text><line x1="730" y1="462" x2="730" y2="288" stroke="#6fd8e8" stroke-width="1.5" stroke-dasharray="5 6"/><circle cx="730" cy="480" r="10" fill="#6fd8e8" stroke="none" stroke-width="2"/><text x="730" y="508" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">gVisor</text><circle cx="730" cy="270" r="10" fill="#6fd8e8" stroke="none" stroke-width="2"/><text x="730" y="246" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">gVisor rootless</text><text x="746" y="374" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">su propio modo</text><text x="746" y="390" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">rootless</text><rect x="872" y="252" width="60" height="246" rx="30" fill="#141b20" stroke="#c9a7ff" stroke-width="2.5"/><text x="902" y="232" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Kata</text><text x="902" y="520" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">el eje vertical</text><text x="902" y="534" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">depende de cómo lo corras</text><rect x="1044" y="252" width="60" height="246" rx="30" fill="#141b20" stroke="#ffc857" stroke-width="2.5"/><text x="1074" y="232" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">VM completa</text><text x="1074" y="520" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">el eje vertical</text><text x="1074" y="534" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">depende de cómo lo corras</text><text x="600" y="728" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Rootless no añade ninguna frontera: mismo kernel, misma superficie de syscalls. Mueve el eje vertical y no el horizontal.</text><text x="600" y="750" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Por eso gVisor tiene su propio modo rootless: los dos ejes se componen, no se ordenan.</text><text x="600" y="772" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Y rootless no sale gratis: habilitar user namespaces no privilegiados abre interfaces del kernel que normalmente están restringidas.</text></svg>