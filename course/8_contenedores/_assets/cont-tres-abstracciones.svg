<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-label="Tres paneles en fila con su analogia arriba y su termino abajo: la receta escrita es el Dockerfile, el platillo congelado es la imagen y el platillo servido es el contenedor, unidos por las flechas docker build y docker run. Del platillo congelado salen tres platos servidos identicos; bajo la imagen dice inmutable y bajo los contenedores dice efimeros"><rect x="0" y="0" width="1160" height="520" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="580" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Receta, congelado, servido</text><text x="580" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las tres cosas que todo el mundo confunde</text><rect x="40" y="96" width="280" height="330" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="180" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la receta escrita</text><rect x="100" y="150" width="160" height="170" rx="8" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.5"/><text x="112" y="178" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">FROM python:3.12</text><text x="112" y="202" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">WORKDIR /app</text><text x="112" y="226" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">COPY . .</text><text x="112" y="250" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">RUN pip install</text><text x="112" y="274" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">CMD ["python"]</text><text x="180" y="368" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">Dockerfile</text><text x="180" y="396" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">texto, y va en git</text><rect x="440" y="96" width="280" height="330" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="580" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el platillo congelado</text><text x="540" y="202" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">❄</text><text x="580" y="190" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">❄</text><text x="620" y="202" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">❄</text><ellipse cx="580" cy="248" rx="88" ry="30" fill="#141b20" stroke="#c9a7ff" stroke-width="2.5"/><ellipse cx="580" cy="242" rx="54" ry="18" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.5"/><text x="580" y="300" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">sha256:6a2f…</text><text x="580" y="368" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">imagen</text><text x="580" y="396" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">inmutable</text><rect x="840" y="96" width="280" height="330" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="980" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el platillo servido</text><ellipse cx="980" cy="180" rx="70" ry="22" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><ellipse cx="980" cy="176" rx="42" ry="13" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><ellipse cx="980" cy="236" rx="70" ry="22" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><ellipse cx="980" cy="232" rx="42" ry="13" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><ellipse cx="980" cy="292" rx="70" ry="22" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><ellipse cx="980" cy="288" rx="42" ry="13" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><text x="980" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">tres, de la misma imagen</text><text x="980" y="368" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">contenedor</text><text x="980" y="396" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">efímeros</text><text x="380" y="150" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">docker build</text><line x1="326" y1="246" x2="434" y2="246" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="780" y="150" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">docker run</text><line x1="726" y1="246" x2="834" y2="186" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="726" y1="246" x2="834" y2="240" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="726" y1="246" x2="834" y2="292" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="580" y="468" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">De una receta salen muchos congelados idénticos; de un congelado, muchos platos servidos.</text><text x="580" y="492" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Borrar el plato no toca el congelado. Cambiar la receta tampoco: para eso hay que volver a construir.</text></svg>