<svg xmlns="http://www.w3.org/2000/svg" width="880" height="696" viewBox="0 0 880 696" role="img" aria-label="Matriz para predecir, sin respuestas, del laboratorio con volumen. Ocho filas: bind mount editando en el host, bind mount editando adentro, bind mount editando adentro y luego docker build, bind mount mas rebuild corriendo con el montaje, bind mount de solo lectura escribiendo adentro, named volume sobre barra app la primera vez, named volume sobre barra app tras un rebuild con codigo nuevo, y named volume de datos tras docker rm. Tres columnas: si se ve adentro, si cambia tu disco y si cambia la imagen. Cada celda lleva un signo de interrogacion: se predice antes de correrla, y las respuestas estan en la tabla del final de la pagina"><rect x="0" y="0" width="880" height="696" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="440.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Con volumen: ¿qué cambia qué?</text><text x="440.0" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Predice cada celda antes de correrla; las respuestas están en la tabla del final</text><text x="64" y="124" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">lo que haces</text><text x="490" y="112" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">¿se ve</text><text x="490" y="130" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">adentro?</text><text x="630" y="112" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">¿cambia</text><text x="630" y="130" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">tu disco?</text><text x="770" y="112" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">¿cambia</text><text x="770" y="130" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">la imagen?</text><line x1="40" y1="140" x2="840" y2="140" stroke="#4a7a63" stroke-width="1.5"/><rect x="40.0" y="150.0" width="800.0" height="58.0" rx="8" fill="#141b20"/><rect x="46.0" y="162.0" width="7.0" height="34.0" rx="3" fill="#6fd8e8"/><text x="64" y="175.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">bind mount: edita