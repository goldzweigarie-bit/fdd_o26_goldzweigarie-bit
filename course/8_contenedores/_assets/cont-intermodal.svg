fc857"/><rect x="423.0" y="167.0" width="22.0" height="22.0" rx="10" fill="#c9a7ff"/><rect x="451.0" y="160.0" width="26.0" height="32.0" rx="3" fill="#ff8a7a"/><line x1="323" y1="162" x2="376" y2="162" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="553" y="118" width="108" height="88" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="607.0" y="140" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">tren</text><rect x="567.0" y="162.0" width="20.0" height="28.0" rx="6" fill="#ffc857"/><rect x="594.0" y="167.0" width="22.0" height="22.0" rx="10" fill="#c9a7ff"/><rect x="622.0" y="160.0" width="26.0" height="32.0" rx="3" fill="#ff8a7a"/><line x1="494" y1="162" x2="547" y2="162" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="724" y="118" width="108" height="88" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="778.0" y="140" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">bodega</text><rect x="738.0" y="162.0" width="20.0" height="28.0" rx="6" fill="#ffc857"/><rect x="765.0" y="167.0" width="22.0" height="22.0" rx="10" fill="#c9a7ff"/><rect x="793.0" y="160.0" width="26.0" height="32.0" rx="3" fill="#ff8a7a"/><line x1="665" y1="162" x2="718" y2="162" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><text x="179.5" y="228" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">descargar y recargar</text><text x="179.5" y="246" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ tiempo + costo</text><text x="350.5" y="228" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">descargar y recargar</text><text x="350.5" y="246" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ tiempo + costo</text><text x="521.5" y="228" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">descargar y recargar</text><text x="521.5" y="246" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ tiempo + costo</text><text x="692.5" y="228" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">descargar y recargar</text><text x="692.5" y="246" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ tiempo + costo</text><text x="40" y="284" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">desde 1956 · el contenedor intermodal</text><rect x="40" y="298" width="108" height="88" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="94.0" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">muelle</text><rect x="52.0" y="339" width="84" height="34" rx="4" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><line x1="73.0" y1="341" x2="73.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><line x1="94.0" y1="341" x2="94.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><line x1="115.0" y1="341" x2="115.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><circle cx="136.0" cy="356" r="5" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><rect x="211" y="298" width="108" height="88" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="265.0" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">camión</text><rect x="223.0" y="339" width="84" height="34" rx="4" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><line x1="244.0" y1="341" x2="244.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><line x1="265.0" y1="341" x2="265