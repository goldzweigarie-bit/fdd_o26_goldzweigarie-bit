<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="Dos recorridos paralelos del mismo muelle a la misma bodega pasando por camion, barco y tren. Arriba, la carga suelta de antes de 1956 se descarga y se vuelve a cargar en cada trasbordo, con su costo marcado; abajo, el contenedor sellado pasa de vehiculo en vehiculo sin abrirse. A la derecha, las equivalencias con el software: la carga es tu programa con sus dependencias, el contenedor es la imagen y los tres vehiculos son tu laptop, la maquina del companero y el servidor"><rect x="0" y="0" width="1240" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orien