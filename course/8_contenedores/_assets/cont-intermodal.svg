idth="2"/><text x="778.0" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">bodega</text><rect x="736.0" y="339" width="84" height="34" rx="4" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><line x1="757.0" y1="341" x2="757.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><line x1="778.0" y1="341" x2="778.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><line x1="799.0" y1="341" x2="799.0" y2="371" stroke="#7ef29d" stroke-width="1.2"/><circle cx="820.0" cy="356" r="5" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><line x1="665" y1="342" x2="718" y2="342" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="436" y="412" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">en ningún trasbordo se abre la caja: se mueve entera, sellada</text><text x="265.0" y="442" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tu laptop</text><text x="436.0" y="442" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la máquina del compañero</text><text x="607.0" y="442" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el servidor</text><rect x="880" y="100" width="320" height="348" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="1040" y="130" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">lo mismo, en software</text><line x1="900" y1="252" x2="1180" y2="252" stroke="#4a7a63" stroke-width="1"/><line x1="900" y1="340" x2="1180" y2="340" stroke="#4a7a63" stroke-width="1"/><text x="1040" y="168" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">la carga suelta</text><text x="1040" y="190" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">≡</text><text x="1040" y="214" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tu programa, con todas</text><text x="1040" y="234" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">sus dependencias</text><text x="1040" y="274" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el contenedor sellado</text><text x="1040" y="296" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">≡</text><text x="1040" y="322" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">la imagen</text><text x="1040" y="362" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">los tres vehículos</text><text x="1040" y="384" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">≡</text><text x="1040" y="408" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">tu laptop, la máquina del</text><text x="1040" y="428" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">compañero y el servidor</text><text x="620" y="500" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">McLean no inventó la caja: inventó que nadie tuviera que abrirla. En cada trasbordo se mueve el bulto entero, sellado.</text><text x="620" y="526" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Una imagen es eso. La máquina que la recibe no la abre para acomodar lo de adentro: la corre tal cual llegó.</text></svg>