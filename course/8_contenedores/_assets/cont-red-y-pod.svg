<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" role="img" aria-label="Tres escenarios con la misma pareja de contenedores, un servicio web y una base. En la red bridge por omision se alcanzan por IP pero no hay resolucion por nombre, y el intento por nombre aparece tachado. En una red creada por ti se alcanzan por nombre, y la IP va tachada porque cambia en cada arranque. En un pod de Podman comparten localhost y se hablan por puerto, sin nombre de por medio. Alrededor de los tres, la linea del host, con la unica flecha que la atraviesa rotulada -p 5432:5432 y etiquetada como lo que es: superficie expuesta y decision de diseno"><rect x="0" y="0" width="1360" height="720" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="680" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Que dos contenedores se hablen</text><text x="680" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tres redes, y sólo en una de ellas el nombre significa algo</text><rect x="40" y="168" width="1280" height="448" rx="14" fill="none" stroke="#a7b8ad" stroke-width="2" stroke-dasharray="7 7"/><text x="66" y="194" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">el host</text><rect x="70" y="212" width="350" height="384" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="245" y="244" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">la red bridge por omisión</text><text x="245" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">docker run  (sin --network)</text><rect x="90" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="155" y="322" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">api</text><text x="155" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">sin estado</text><rect x="270" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="335" y="322" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">db</text><text x="335" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">postgres:16</text><line x1="226" y1="325" x2="264" y2="325" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><line x1="96" y1="392" x2="102.0" y2="397.6" stroke="#7ef29d" stroke-width="2.5"/><line x1="102.0" y1="397.6" x2="112" y2="385.6" stroke="#7ef29d" stroke-width="2.5"/><text x="122" y="397" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">así sí se hablan</text><text x="94" y="424" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h 172.17.0.3</text><text x="94" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">por IP sí llega</text><line x1="96" y1="472" x2="112" y2="488" stroke="#ff8a7a" stroke-width="2.5"/><line x1="96" y1="488" x2="112" y2="472" stroke="#ff8a7a" stroke-width="2.5"/><text x="122" y="485" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">y así no</text><text x="94" y="512" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h db</text><line x1="92" y1="508" x2="169.0" y2="508" stroke="#ff8a7a" stroke-width="2"/><text x="94" y="534" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">could not translate host name</text><text x="245" y="562" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">No hay DNS en la bridge por omisión.</text><text x="245" y="579" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Y esa IP cambia en cada arranque.</text><rect x="456" y="212" width="350" height="384" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="631" y="244" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">una red creada por ti</text><text x="631" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">docker network create datos</text><rect x="476" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="541" y="322" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">api</text><text x="541" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">sin estado</text><rect x="656" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="721" y="322" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">db</text><text x="721" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">postgres:16</text><line x1="612" y1="325" x2="650" y2="325" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="482" y1="392" x2="488.0" y2="397.6" stroke="#7ef29d" stroke-width="2.5"/><line x1="488.0" y1="397.6" x2="498" y2="385.6" stroke="#7ef29d" stroke-width="2.5"/><text x="508" y="397" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">así sí se hablan</text><text x="480" y="424" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h db</text><text x="480" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">por nombre: hay DNS embebido</text><line x1="482" y1="472" x2="498" y2="488" stroke="#ff8a7a" stroke-width="2.5"/><line x1="482" y1="488" x2="498" y2="472" stroke="#ff8a7a" stroke-width="2.5"/><text x="508" y="485" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">y así no</text><text x="480" y="512" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h 172.18.0.3</text><line x1="478" y1="508" x2="613.4" y2="508" stroke="#ff8a7a" stroke-width="2"/><text x="480" y="534" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">funciona hoy, falla mañana</text><text x="631" y="562" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">El DNS resuelve el nombre del contenedor.</text><text x="631" y="579" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">La IP es justo lo que no debes escribir.</text><rect x="842" y="212" width="350" height="384" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="1017" y="244" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">un pod de Podman</text><text x="1017" y="266" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">podman pod create --name app</text><rect x="862" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="927" y="322" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">api</text><text x="927" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">sin estado</text><rect x="1042" y="292" width="130" height="66" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="1107" y="322" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">db</text><text x="1107" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">postgres:16</text><line x1="998" y1="325" x2="1036" y2="325" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><line x1="868" y1="392" x2="874.0" y2="397.6" stroke="#7ef29d" stroke-width="2.5"/><line x1="874.0" y1="397.6" x2="884" y2="385.6" stroke="#7ef29d" stroke-width="2.5"/><text x="894" y="397" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">así sí se hablan</text><text x="866" y="424" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h localhost -p 5432</text><text x="866" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">mismo netns: se hablan por puerto</text><line x1="868" y1="472" x2="884" y2="488" stroke="#ff8a7a" stroke-width="2.5"/><line x1="868" y1="488" x2="884" y2="472" stroke="#ff8a7a" stroke-width="2.5"/><text x="894" y="485" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">y así no</text><text x="866" y="512" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">psql -h db</text><line x1="864" y1="508" x2="941.0" y2="508" stroke="#ff8a7a" stroke-width="2"/><text x="866" y="534" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">no hay ningún nombre que resolver</text><text x="1017" y="562" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Comparten el network namespace, como</text><text x="1017" y="579" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">dos procesos de la misma máquina.</text><text x="1250" y="122" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">desde tu máquina</text><line x1="1250" y1="130" x2="1250" y2="154" stroke="#ffc857" stroke-width="2.5"/><rect x="1176.0" y="154" width="148" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="1250" y="173" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">-p 5432:5432</text><line x1="1250" y1="182" x2="1250" y2="325" stroke="#ffc857" stroke-width="2.5"/><line x1="1250" y1="325" x2="1178" y2="325" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><text x="1250" y="372" fill="#ffc857" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">la única flecha</text><text x="1250" y="390" fill="#ffc857" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">que cruza la línea</text><text x="1250" y="416" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">superficie expuesta,</text><text x="1250" y="434" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">y decisión de diseño</text><text x="680" y="660" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Publicar un puerto no es «conectar»: los tres escenarios ya conectan el servicio con la base sin publicar nada.</text><text x="680" y="684" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Un -p abre la base al resto de tu red local, y eso se decide a propósito o no se decide.</text></svg>