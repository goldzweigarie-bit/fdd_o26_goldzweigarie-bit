<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-label="Tres cajas en fila. Dockerfile: la receta, texto en tu carpeta; lo cambia tu editor, lo ves con cat y lo borra rm. Una flecha docker build lleva a la imagen: capas de solo lectura, inmutable; no cambia, otro docker build hace otra imagen; se lista con docker images y se borra con docker rmi. Una flecha docker run lleva al contenedor: un proceso mas su capa de escritura, efimero; lo cambia el proceso o docker exec, se lista con docker ps -a y se borra con docker rm. Del contenedor regresa a la imagen una flecha punteada, docker commit, que existe y no se usa, y al Dockerfile una flecha tachada: nunca desde su capa de escritura: solo un bind mount escribe en tu carpeta. Colgando del contenedor, dos cajas externas, bind mount (tu carpeta) y named volume (area de Docker), que no pasan por la imagen"><rect x="0" y="0" width="1240" height="720" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="620" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dockerfile → imagen → contenedor</text><text x="620" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tres cosas distintas: cada una cambia con su propia herramienta</text><rect x="40" y="96" width="300" height="300" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2.5"/><text x="190.0" y="134" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="middle">Dockerfile</text><text x="190.0" y="162" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">la receta</text><text x="190.0" y="184" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">texto en tu carpeta</text><line x1="60" y1="202" x2="320" y2="202" stroke="#4a7a63" stroke-width="1"/><text x="64" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo cambia</text><text x="64" y="252" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">tu editor</text><text x="64" y="286" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo ves con</text><text x="64" y="308" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">cat Dockerfile</text><text x="64" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo borra</text><text x="64" y="364" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">rm Dockerfile</text><rect x="470" y="96" width="300" height="300" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2.5"/><text x="620.0" y="134" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="middle">imagen</text><text x="620.0" y="162" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">capas de sólo lectura</text><text x="620.0" y="184" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">inmutable</text><line x1="490" y1="202" x2="750" y2="202" stroke="#4a7a63" stroke-width="1"/><text x="494" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">no cambia:</text><text x="494" y="252" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">otro build hace otra</text><text x="494" y="286" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">la ves con</text><text x="494" y="308" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">docker images</text><text x="494" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">la borra</text><text x="494" y="364" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">docker rmi</text><rect x="900" y="96" width="300" height="300" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2.5"/><text x="1050.0" y="134" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="middle">contenedor</text><text x="1050.0" y="162" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">un proceso + su capa de escritura</text><text x="1050.0" y="184" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">efímero</text><line x1="920" y1="202" x2="1180" y2="202" stroke="#4a7a63" stroke-width="1"/><text x="924" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo cambia</text><text x="924" y="252" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">el proceso · docker exec</text><text x="924" y="286" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo ves con</text><text x="924" y="308" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">docker ps -a</text><text x="924" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo borra</text><text x="924" y="364" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="start">docker rm</text><text x="405" y="176" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">docker build</text><line x1="346" y1="192" x2="464" y2="192" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><text x="835" y="176" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">docker run</text><line x1="776" y1="192" x2="894" y2="192" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><text x="835" y="296" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">docker commit</text><line x1="894" y1="312" x2="776" y2="312" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#fffc857)"/><text x="835" y="334" fill="#ffc857" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">existe, no se usa</text><line x1="930" y1="396" x2="930" y2="440" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 6"/><line x1="930" y1="440" x2="190" y2="440" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 6"/><line x1="190" y1="440" x2="190" y2="402" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="482" y="427" width="256" height="26" rx="6" fill="#0b0f12" stroke="#0b0f12" stroke-width="0"/><line x1="495" y1="431" x2="513" y2="449" stroke="#ff8a7a" stroke-width="3"/><line x1="495" y1="449" x2="513" y2="431" stroke="#ff8a7a" stroke-width="3"/><text x="524" y="445" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">nunca desde su capa</text><text x="560" y="470" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">sólo un bind mount escribe en tu carpeta</text><line x1="985" y1="396" x2="985" y2="492" stroke="#6fd8e8" stroke-width="2" stroke-dasharray="5 5"/><rect x="917" y="492" width="136" height="62" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="985" y="518" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">bind mount</text><text x="985" y="540" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">tu carpeta</text><line x1="1135" y1="396" x2="1135" y2="492" stroke="#ffc857" stroke-width="2" stroke-dasharray="5 5"/><rect x="1067" y="492" width="136" height="62" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="1135" y="518" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">named volume</text><text x="1135" y="540" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">área de Docker</text><text x="1060" y="582" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">no pasan por la imagen</text><text x="1060" y="600" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">ni build ni rm los tocan</text><text x="620" y="650" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Cada flecha es un comando: si no lo corriste, la caja de la derecha no se enteró.</text><text x="620" y="676" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Las flechas que se usan van hacia la derecha: lo que pasa adentro no regresa solo a la imagen ni al Dockerfile.</text></svg>