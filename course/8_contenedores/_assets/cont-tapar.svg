<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="880" viewBox="0 0 1340 880" role="img" aria-label="La diferencia que medio internet cuenta al reves, en dos casos sobre el mismo path de una imagen que ya traia archivos. Arriba, un bind mount de un directorio vacio sobre barra bin: siempre tapa, no copia nada nunca, ni en Docker ni en Podman, y el dibujo deja lo de la imagen abajo, intacto e inalcanzable, con ls desaparecido y el error command not found. Abajo, un named volume vacio, que hace lo contrario: la primera vez que se monta copia al volumen lo que la imagen tenia en ese path, con la flecha de copia dibujada explicitamente, y si el volumen ya trae algo entonces si tapa, como el bind mount. Al margen, la opcion que apaga la copia —nocopy con -v y volume-nocopy con --mount— y la consecuencia que explica el laboratorio de Postgres"><rect x="0" y="0" width="1340" height="880" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Tapar y copiar no son lo mismo</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el mismo path, la misma imagen, dos montajes — y resultados opuestos</text><rect x="40" y="100" width="940" height="330" rx="10" fill="none" stroke="#6fd8e8" stroke-width="2"/><text x="60" y="132" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">1 · un bind mount de un directorio vacío, sobre /bin</text><rect x="60" y="156" width="250" height="140" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="185.0" y="182" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que la imagen trae en /bin</text><text x="84" y="208" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">ls</text><text x="84" y="229" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">cat</text><text x="84" y="250" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">sh</text><text x="84" y="271" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">bash</text><line x1="318" y1="226" x2="372" y2="226" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="378" y="156" width="250" height="140" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="503" y="182" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que montas</text><text x="503" y="216" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">-v ./vacio:/bin</text><text x="503" y="248" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">un directorio de tu disco,</text><text x="503" y="268" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">y está vacío</text><line x1="634" y1="226" x2="696" y2="226" stroke="#ff8a7a" stroke-width="2.5" marker-end="url(#fff8a7a)"/><rect x="702" y="156" width="270" height="246" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="837" y="182" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que ves en /bin adentro</text><text x="837" y="216" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">(nada)</text><line x1="722" y1="240" x2="952" y2="240" stroke="#4a7a63" stroke-width="1" stroke-dasharray="5 5"/><text x="837" y="260" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">debajo del montaje, intacto</text><text x="837" y="276" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">e inalcanzable:</text><text x="800" y="300" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">ls</text><line x1="798" y1="296" x2="820" y2="296" stroke="#a7b8ad" stroke-width="1.5"/><text x="800" y="319" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">cat</text><line x1="798" y1="315" x2="829" y2="315" stroke="#a7b8ad" stroke-width="1.5"/><text x="800" y="338" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">sh</text><line x1="798" y1="334" x2="820" y2="334" stroke="#a7b8ad" stroke-width="1.5"/><text x="800" y="357" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">bash</text><line x1="798" y1="353" x2="838" y2="353" stroke="#a7b8ad" stroke-width="1.5"/><text x="837" y="388" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">bash: ls: command not found</text><rect x="60" y="320" width="568" height="88" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="344" y="352" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">SIEMPRE tapa</text><text x="344" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">El bind mount no copia nada, nunca: ni en Docker ni en Podman.</text><text x="344" y="398" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Lo de la imagen sigue ahí abajo, intacto, y nadie lo alcanza.</text><rect x="40" y="450" width="940" height="360" rx="10" fill="none" stroke="#ffc857" stroke-width="2"/><text x="60" y="482" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">2 · un named volume VACÍO, sobre ese mismo /bin</text><rect x="60" y="506" width="250" height="140" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="185.0" y="532" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que la imagen trae en /bin</text><text x="84" y="558" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">ls</text><text x="84" y="579" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">cat</text><text x="84" y="600" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">sh</text><text x="84" y="621" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">bash</text><text x="345" y="556" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">COPIA</text><line x1="318" y1="576" x2="372" y2="576" stroke="#ffc857" stroke-width="3" marker-end="url(#fffc857)"/><rect x="378" y="506" width="250" height="140" rx="8" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="503" y="532" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que montas</text><text x="503" y="566" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">-v midata:/bin</text><text x="503" y="598" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">un volumen nuevo,</text><text x="503" y="618" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">y vacío</text><line x1="634" y1="576" x2="696" y2="576" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="702" y="506" width="270" height="190" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="837" y="532" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">lo que ves en /bin adentro</text><text x="800" y="560" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">ls</text><text x="800" y="581" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">cat</text><text x="800" y="602" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">sh</text><text x="800" y="623" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">bash</text><line x1="722" y1="646" x2="952" y2="646" stroke="#4a7a63" stroke-width="1" stroke-dasharray="5 5"/><text x="837" y="666" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">y midata ahora los guarda:</text><text x="837" y="684" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sobreviven al docker rm</text><rect x="60" y="662" width="568" height="74" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="344" y="694" fill="#ffc857" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">COPIA la primera vez que se monta</text><text x="344" y="720" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Docker copia al volumen lo que la imagen traía en ese path.</text><rect x="60" y="748" width="912" height="50" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="516" y="779" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">¿Y si el volumen YA trae algo? Entonces tapa, igual que el bind mount: la copia ocurre una sola vez.</text><rect x="1000" y="100" width="300" height="330" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="1150" y="132" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">cómo se apaga la copia</text><text x="1020" y="172" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">-v midata:/bin:nocopy</text><text x="1020" y="196" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">con la sintaxis corta</text><text x="1020" y="234" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">--mount type=volume,</text><text x="1036" y="254" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">volume-nocopy=true,…</text><text x="1020" y="278" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">con la sintaxis larga</text><line x1="1020" y1="298" x2="1280" y2="298" stroke="#4a7a63" stroke-width="1"/><text x="1020" y="324" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Son la misma opción con dos</text><text x="1020" y="343" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">nombres. Sin ella, copiar ES el</text><text x="1020" y="362" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">comportamiento por omisión del</text><text x="1020" y="381" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">named volume — no una rareza.</text><rect x="1000" y="450" width="300" height="360" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="1150" y="482" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">y por eso el laboratorio</text><text x="1150" y="502" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">de Postgres funciona</text><text x="1020" y="538" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">postgres:16 trae vacío su</text><text x="1020" y="557" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">/var/lib/postgresql/data y lo</text><text x="1020" y="576" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">inicializa al arrancar.</text><text x="1020" y="595" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start"></text><text x="1020" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">El named volume nuevo se lleva</text><text x="1020" y="633" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">esa inicialización, y el</text><text x="1020" y="652" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">contenedor siguiente la</text><text x="1020" y="671" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">encuentra hecha.</text><text x="1020" y="690" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start"></text><text x="1020" y="709" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Con un bind mount a un directorio</text><text x="1020" y="728" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">vacío saldría igual —pero por</text><text x="1020" y="747" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">otra razón: porque la imagen</text><text x="1020" y="766" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">también traía ese path vacío.</text><text x="670" y="840" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La regla no es «el volumen copia y el bind mount no»: es que el bind mount NUNCA copia, y el named volume copia UNA vez, y sólo si está vacío.</text><text x="670" y="864" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Medio internet lo cuenta al revés. Compruébalo con ls, no con un blog.</text></svg>