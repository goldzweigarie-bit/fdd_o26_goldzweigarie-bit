<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-label="Arbol de comprobacion de que de verdad corres sin sudo. Arriba, seis comandos en fila con lo que cada uno debe imprimir: whoami, id -u, type -a docker, docker context ls, docker version y docker run --rm hello-world. Abajo, las ocho formas de creer que corres sin sudo sin correr sin sudo, cada tarjeta colgada del comando que la delata: el alias con sudo adentro y la funcion de shell bajo type, ser root en WSL2 bajo whoami, el sudo -i olvidado bajo id -u, el DOCKER_HOST remoto bajo docker context ls, Podman diciendose Docker bajo docker version, y bajo la prueba final el newgrp de una sola ventana y el chmod 666 del socket, tachado en rojo. Al pie, la advertencia que se cobra en la seccion 3: estar en el grupo docker es ser root"><rect x="0" y="0" width="1360" height="700" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="680" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Correr sin sudo, y creer que corres sin sudo</text><text x="680" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">seis comandos que lo comprueban, y las ocho maneras de fallar la comprobación sin notarlo</text><text x="48" y="112" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">la cadena, en orden</text><text x="1320" y="112" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">y abajo, las ocho trampas: cada una cuelga del comando que la delata</text><rect x="40" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="140" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">whoami</text><line x1="54" y1="190" x2="226" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="140" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">debe decir tu usuario,</text><text x="140" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">nunca root</text><line x1="140" y1="252" x2="140" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="40" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="140.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">ser root en WSL2</text><line x1="54" y1="356" x2="226" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="140.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">whoami dice root: ahí no</text><text x="140.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">hay sudo que quitar,</text><text x="140.0" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">ya eres root.</text><rect x="256" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="356" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">id -u</text><line x1="270" y1="190" x2="442" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="356" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">debe decir un número</text><text x="356" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">distinto de 0</text><line x1="242" y1="190" x2="252" y2="190" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><line x1="356" y1="252" x2="356" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="256" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="356.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">el sudo -i olvidado</text><line x1="270" y1="356" x2="442" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="356.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">llevas media hora en una</text><text x="356.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">shell de root y el prompt</text><text x="356.0" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">ya no te lo recuerda.</text><rect x="472" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="572" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">type -a docker</text><line x1="486" y1="190" x2="658" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="572" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">debe decir un binario,</text><text x="572" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">no un alias ni una función</text><line x1="458" y1="190" x2="468" y2="190" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><line x1="572" y1="252" x2="572" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="472" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="572.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">un alias con sudo</text><text x="572.0" y="344" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">adentro</text><line x1="486" y1="356" x2="658" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="572.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">docker is aliased to</text><text x="572.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">'sudo docker'</text><line x1="572" y1="416" x2="572" y2="430" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="472" y="436" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="572.0" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">una función de shell</text><line x1="486" y1="492" x2="658" y2="492" stroke="#4a7a63" stroke-width="1"/><text x="572.0" y="512" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">docker is a function</text><text x="572.0" y="528" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">— y adentro dice sudo</text><rect x="688" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="788" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">docker context ls</text><line x1="702" y1="190" x2="874" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="788" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el contexto activo debe</text><text x="788" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">ser default, y local</text><line x1="674" y1="190" x2="684" y2="190" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><line x1="788" y1="252" x2="788" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="688" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="788.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">un DOCKER_HOST a</text><text x="788.0" y="344" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">otra máquina</text><line x1="702" y1="356" x2="874" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="788.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">corres sin sudo, sí:</text><text x="788.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">pero en un servidor</text><text x="788.0" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">que no es el tuyo.</text><rect x="904" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="1004" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">docker version</text><line x1="918" y1="190" x2="1090" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="1004" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">debe traer Client y Server,</text><text x="1004" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">y decir Docker Engine</text><line x1="890" y1="190" x2="900" y2="190" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><line x1="1004" y1="252" x2="1004" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="904" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="1004.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Podman diciendo</text><text x="1004.0" y="344" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">que es Docker</text><line x1="918" y1="356" x2="1090" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="1004.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">docker version dice</text><text x="1004.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Podman Engine: es el</text><text x="1004.0" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">paquete podman-docker.</text><rect x="1120" y="132" width="200" height="116" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="1220" y="162" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">docker run --rm</text><text x="1220" y="180" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">hello-world</text><line x1="1134" y1="190" x2="1306" y2="190" stroke="#4a7a63" stroke-width="1"/><text x="1220" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la prueba de verdad:</text><text x="1220" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">si esto corre, corres</text><line x1="1106" y1="190" x2="1116" y2="190" stroke="#a7b8ad" stroke-width="1.5" marker-end="url(#fa7b8ad)"/><line x1="1220" y1="252" x2="1220" y2="294" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="1120" y="300" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="1220.0" y="326" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">el newgrp que sólo</text><text x="1220.0" y="344" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">valía en esa ventana</text><line x1="1134" y1="356" x2="1306" y2="356" stroke="#4a7a63" stroke-width="1"/><text x="1220.0" y="376" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">funciona aquí y falla en</text><text x="1220.0" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la terminal nueva: falta</text><text x="1220.0" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">cerrar sesión y volver.</text><line x1="1220" y1="416" x2="1220" y2="430" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><rect x="1120" y="436" width="200" height="116" rx="8" fill="#141b20" stroke="#ff8a7a" stroke-width="1.8"/><text x="1220.0" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">chmod 666 del socket</text><line x1="1138" y1="458" x2="1302" y2="458" stroke="#ff8a7a" stroke-width="2.5"/><line x1="1134" y1="492" x2="1306" y2="492" stroke="#4a7a63" stroke-width="1"/><text x="1220.0" y="512" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">funciona, y por eso es peor:</text><text x="1220.0" y="528" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">se lo abriste a todos</text><text x="1220.0" y="544" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">los usuarios de la máquina.</text><text x="680" y="578" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Son ocho, no nueve: el chmod 666 del socket y «dejar el socket suelto» son la misma trampa con dos nombres.</text><rect x="40" y="596" width="1280" height="84" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="680" y="626" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Y la que se cobra en la sección 3: estar en el grupo docker ES ser root.</text><text x="680" y="652" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Quien le puede hablar al socket puede montar / del host dentro de un contenedor. No hay privilegio que escalar: ya lo tiene.</text></svg>