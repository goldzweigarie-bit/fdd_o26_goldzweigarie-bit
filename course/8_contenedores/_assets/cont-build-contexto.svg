<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="830" viewBox="0 0 1300 830" role="img" aria-label="Que significa el punto final de docker build -t mi-imagen punto: el directorio que hace de contexto, el unico lugar de donde el build puede leer. Con BuildKit no viaja la carpeta entera: viaja lo que piden los COPY, y con COPY punto punto eso es todo, menos lo que .dockerignore recorta. A la izquierda, la carpeta en disco con app.py y requirements.txt livianos y el .git, el entorno virtual y los datos crudos pesando gigabytes; en medio, .dockerignore como un colador; a la derecha, lo que llega al daemon. Un COPY de fuera del contexto falla con failed to compute cache key, not found. Abajo, tres notas: -f cambia que Dockerfile se lee pero no el contexto, --no-cache solo ignora las capas previas, y el error de escribir la ruta del Dockerfile donde va el contexto: unable to prepare context, path not found"><rect x="0" y="0" width="1300" height="830" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="650" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El punto final de docker build no es «aquí»</text><text x="650" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">es «el build sólo puede leer de este directorio»</text><text x="472" y="152" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" text-anchor="start">docker build -t mi-imagen</text><rect x="818" y="128" width="34" height="34" rx="6" fill="#16302a" stroke="#ff8a7a" stroke-width="2.5"/><text x="835" y="152" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" text-anchor="middle">.</text><line x1="835" y1="166" x2="835" y2="196" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><text x="858" y="192" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">esto es el CONTEXTO, no «aquí»</text><rect x="50" y="224" width="350" height="286" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="225" y="252" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tu carpeta, en disco</text><text x="225" y="274" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="middle">~/fdd/docker-lab</text><text x="74" y="306" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">app.py</text><text x="376" y="306" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="end">4 KB</text><text x="74" y="334" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">requirements.txt</text><text x="376" y="334" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="end">1 KB</text><text x="74" y="362" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">Dockerfile</text><text x="376" y="362" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="end">1 KB</text><text x="74" y="390" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">.git/</text><text x="376" y="390" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="end">182 MB</text><text x="74" y="418" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">.venv/</text><text x="376" y="418" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="end">310 MB</text><text x="74" y="446" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">crudos/</text><text x="376" y="446" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="end">1.2 GB</text><line x1="74" y1="486" x2="376" y2="486" stroke="#4a7a63" stroke-width="1"/><text x="376" y="504" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="end">1.5 GB en total</text><line x1="404" y1="360" x2="436" y2="360" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="442" y="250" width="86" height="220" rx="10" fill="none" stroke="#ffc857" stroke-width="2" stroke-dasharray="7 7"/><text x="485" y="236" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">.dockerignore</text><line x1="452" y1="274" x2="518" y2="274" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="452" y1="306" x2="518" y2="306" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="452" y1="338" x2="518" y2="338" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="452" y1="370" x2="518" y2="370" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="452" y1="402" x2="518" y2="402" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="452" y1="434" x2="518" y2="434" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="534" y1="360" x2="566" y2="360" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><line x1="485" y1="474" x2="485" y2="502" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#fff8a7a)"/><text x="452" y="524" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">lo que .dockerignore recorta antes del envío:</text><line x1="461" y1="541" x2="475" y2="555" stroke="#ff8a7a" stroke-width="2"/><line x1="461" y1="555" x2="475" y2="541" stroke="#ff8a7a" stroke-width="2"/><text x="488" y="553" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">.git/  ·  182 MB</text><line x1="461" y1="565" x2="475" y2="579" stroke="#ff8a7a" stroke-width="2"/><line x1="461" y1="579" x2="475" y2="565" stroke="#ff8a7a" stroke-width="2"/><text x="488" y="577" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">.venv/  ·  310 MB</text><line x1="461" y1="589" x2="475" y2="603" stroke="#ff8a7a" stroke-width="2"/><line x1="461" y1="603" x2="475" y2="589" stroke="#ff8a7a" stroke-width="2"/><text x="488" y="601" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">crudos/  ·  1.2 GB</text><rect x="572" y="300" width="250" height="124" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="697" y="330" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el contexto</text><text x="697" y="354" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">lo que piden los COPY</text><text x="697" y="388" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="middle">6 KB</text><text x="697" y="410" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">con COPY . . y el colador</text><line x1="826" y1="362" x2="878" y2="362" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><rect x="884" y="300" width="366" height="124" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="1067" y="330" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el daemon (BuildKit)</text><text x="908" y="356" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Pide sólo lo que nombran los COPY:</text><text x="908" y="374" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">con COPY . . es todo el «.», menos</text><text x="908" y="392" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">lo que .dockerignore recorta.</text><rect x="884" y="448" width="366" height="124" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="1067" y="478" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">y por eso esto falla</text><text x="908" y="506" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">COPY ../datos .</text><text x="908" y="530" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">failed to compute cache key:</text><text x="908" y="550" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">... "/datos": not found</text><rect x="40" y="616" width="400" height="136" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="60" y="646" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">-f cambia el Dockerfile, no el contexto</text><text x="60" y="676" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">docker build -f otro/Dockerfile .</text><text x="60" y="698" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lee ese archivo; el contexto sigue siendo el «.».</text><text x="60" y="720" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Son dos argumentos distintos y se confunden todo el tiempo.</text><rect x="460" y="616" width="380" height="136" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="480" y="646" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">--no-cache no toca el contexto</text><text x="480" y="676" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Sólo ignora las capas ya construidas.</text><text x="480" y="698" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Lo que piden los COPY se lee igual,</text><text x="480" y="720" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">del mismo contexto.</text><rect x="860" y="616" width="400" height="136" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="880" y="646" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">el error más común</text><text x="880" y="676" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">docker build -t mi-imagen ./Dockerfile</text><text x="880" y="698" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">unable to prepare context: path "./Dockerfile"</text><text x="880" y="720" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">not found  — ahí va el contexto, no el archivo.</text><text x="650" y="790" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El contexto es lo que el daemon puede ver: si tu archivo no entró en el bulto, para el build no existe.</text></svg>