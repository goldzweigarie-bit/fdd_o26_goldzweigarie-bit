<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="830" viewBox="0 0 1300 830" role="img" aria-label="Cuatro maneras de escribir el origen de un -v y que hace cada una. La ruta absoluta monta ese directorio y nunca es portable. La ruta relativa con -v punto barra app dos puntos barra app funciona desde Docker CLI 23 y tambien en Podman. La forma portable usa -v con pwd entre comillas. Y -v app dos puntos barra app, sin el punto barra, no es una ruta: Docker crea un named volume vacio con ese nombre y lo monta en silencio, sin error y sin aviso, y el codigo no aparece por ningun lado. Abajo, un recuadro dibuja por que en macOS y en Windows el bind mount cruza la frontera de una maquina virtual, y por eso ahi es mas lento y los permisos se comportan distinto"><rect x="0" y="0" width="1300" height="830" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="650" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Cuatro maneras de escribir el origen de un -v</text><text x="650" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y una de las cuatro no es una ruta</text><rect x="50" y="108" width="420" height="76" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="260" y="142" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">-v /home/tu/app:/app</text><text x="260" y="166" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">la ruta absoluta</text><line x1="476" y1="146" x2="516" y2="146" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="522" y="108" width="728" height="76" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="544" y="140" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Monta ese directorio y nada más. Siempre funciona y nunca es portable:</text><text x="544" y="162" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">esa ruta no existe en la máquina de nadie más.</text><rect x="50" y="204" width="420" height="76" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="260" y="238" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">-v ./app:/app</text><text x="260" y="262" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">la ruta relativa</text><line x1="476" y1="242" x2="516" y2="242" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="522" y="204" width="728" height="76" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="544" y="236" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">El ./ es lo que la vuelve ruta. Funciona desde Docker CLI 23 (2023)</text><text x="544" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y también en Podman. Se resuelve contra tu directorio actual.</text><rect x="50" y="300" width="420" height="76" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="260" y="334" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">-v "$(pwd)/app":/app</text><text x="260" y="358" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">la forma portable</text><line x1="476" y1="338" x2="516" y2="338" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="522" y="300" width="728" height="76" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="544" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">El shell la vuelve absoluta antes de que Docker la vea, así que</text><text x="544" y="354" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">funciona con cualquier versión. Las comillas son por los espacios.</text><rect x="50" y="396" width="420" height="76" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="260" y="430" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">-v app:/app</text><text x="260" y="454" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">esto NO es una ruta</text><line x1="476" y1="434" x2="516" y2="434" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><rect x="522" y="396" width="728" height="76" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="544" y="428" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Le falta el ./ , y sin él Docker no ve una ruta: ve un nombre.</text><text x="544" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Crea un named volume vacío llamado app y lo monta en silencio.</text><text x="650" y="512" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sin error y sin aviso: docker volume ls lo delata, y tu código no aparece por ningún lado dentro del contenedor.</text><line x1="40" y1="540" x2="1260" y2="540" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="650" y="574" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">y en macOS y en Windows, el bind mount cruza una frontera más</text><rect x="70" y="600" width="300" height="96" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="220" y="630" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tu disco</text><text x="220" y="654" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">APFS en macOS,</text><text x="220" y="672" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">NTFS en Windows</text><line x1="376" y1="648" x2="418" y2="648" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="426" y="600" width="96" height="96" rx="10" fill="none" stroke="#ffc857" stroke-width="2" stroke-dasharray="7 7"/><text x="474" y="640" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">la frontera</text><text x="474" y="660" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">de la VM</text><line x1="528" y1="648" x2="558" y2="648" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="566" y="600" width="300" height="96" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="716" y="630" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">la VM de Linux</text><text x="716" y="654" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">la que Docker Desktop</text><text x="716" y="672" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">enciende sin decírtelo</text><line x1="872" y1="648" x2="920" y2="648" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="928" y="600" width="300" height="96" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="1078" y="630" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el contenedor</text><text x="1078" y="654" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">que cree estar leyendo</text><text x="1078" y="672" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">un disco normal</text><text x="650" y="730" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cada lectura y cada escritura del bind mount cruzan ese puente: por eso ahí es más lento que en Linux nativo,</text><text x="650" y="752" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">y por eso los permisos los inventa el filesystem compartido en vez de salir de tu disco.</text><text x="650" y="794" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">En Linux no hay puente: el bind mount es el mismo inodo del mismo kernel, y por eso ahí el dueño del archivo sí es una pregunta con respuesta.</text></svg>