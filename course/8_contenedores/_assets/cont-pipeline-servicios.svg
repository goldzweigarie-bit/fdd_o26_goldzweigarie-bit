<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="780" viewBox="0 0 1360 780" role="img" aria-label="El pipeline de la unidad 2 repartido en servicios dentro de una red propia: extraccion, transformacion y carga como tres contenedores sin estado, la base de datos con su named volume como el unico que guarda algo, y el tablero que la lee. Cada flecha lleva rotulado el contrato por el que pasa —nombre y puerto, o variable de entorno— y solo una cruza la linea del host, la del tablero, porque la base no publica puerto. Al margen, por que la base casi nunca se parte, y que sobrevive a un docker rm de cada pieza"><rect x="0" y="0" width="1360" height="780" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="680" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El pipeline de la unidad 2, repartido en servicios</text><text x="680" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cada flecha es un contrato, y sólo una cruza la línea del host</text><rect x="60" y="170" width="970" height="330" rx="14" fill="none" stroke="#7ef29d" stroke-width="2" stroke-dasharray="7 7"/><text x="80" y="196" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">docker network create pipeline</text><rect x="213.5" y="212" width="93" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="260" y="231" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">RAW_DIR</text><text x="260" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">variable de entorno</text><rect x="397.5" y="212" width="115" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="455" y="231" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">CLEAN_DIR</text><text x="455" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">variable de entorno</text><rect x="598.5" y="212" width="93" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="645" y="231" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">db:5432</text><text x="645" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">nombre y puerto</text><rect x="788.5" y="212" width="93" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="835" y="231" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">db:5432</text><text x="835" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">nombre y puerto</text><rect x="90" y="266" width="150" height="110" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="165" y="300" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">extracción</text><text x="165" y="322" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">descarga el crudo</text><text x="165" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sin estado</text><rect x="280" y="266" width="150" height="110" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="355" y="300" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">transformación</text><text x="355" y="322" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">limpia y normaliza</text><text x="355" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sin estado</text><line x1="246" y1="321" x2="274" y2="321" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="470" y="266" width="150" height="110" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="545" y="300" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">carga</text><text x="545" y="322" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">escribe en la base</text><text x="545" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sin estado</text><line x1="436" y1="321" x2="464" y2="321" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="660" y="266" width="150" height="110" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="735" y="300" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">db</text><text x="735" y="322" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">postgres:16</text><text x="735" y="350" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">el único con estado</text><line x1="626" y1="321" x2="654" y2="321" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="850" y="266" width="150" height="110" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="925" y="300" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">tablero</text><text x="925" y="322" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">streamlit</text><text x="925" y="350" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">sin estado</text><line x1="816" y1="321" x2="844" y2="321" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><line x1="735" y1="376" x2="735" y2="404" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><rect x="660" y="410" width="150" height="62" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="735" y="438" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">pgdata</text><text x="735" y="458" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">named volume</text><text x="640" y="434" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">el único que guarda algo</text><text x="640" y="454" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="end">de todo el dibujo</text><line x1="40" y1="536" x2="1330" y2="536" stroke="#a7b8ad" stroke-width="2" stroke-dasharray="9 7"/><text x="60" y="560" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">la línea del host</text><line x1="925" y1="376" x2="925" y2="522" stroke="#6fd8e8" stroke-width="2.5"/><rect x="851.0" y="522" width="148" height="28" rx="6" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="925" y="541" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">-p 8501:8501</text><line x1="925" y1="550" x2="925" y2="598" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><rect x="820" y="602" width="210" height="66" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="925" y="630" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">tu navegador</text><text x="925" y="652" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">la única pieza que se publica</text><text x="1046" y="630" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">la base no publica puerto:</text><text x="1046" y="650" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">sólo el tablero la alcanza,</text><text x="1046" y="668" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">y por nombre</text><rect x="1050" y="170" width="280" height="150" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="1190" y="200" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">por qué la base</text><text x="1190" y="220" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">casi nunca se parte</text><text x="1068" y="248" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Partir un servicio con</text><text x="1068" y="266" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">estado obliga a repartir</text><text x="1068" y="284" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">el dato, y eso cuesta</text><text x="1068" y="302" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">más que lo que compra.</text><rect x="1050" y="340" width="280" height="160" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="1190" y="370" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">qué sobrevive a</text><text x="1190" y="390" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">un docker rm</text><text x="1068" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">De las cinco piezas: sólo</text><text x="1068" y="435" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo que hay en pgdata.</text><text x="1068" y="452" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Las otras cuatro se</text><text x="1068" y="469" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">reponen con un run, y por</text><text x="1068" y="486" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">eso pueden morir.</text><text x="680" y="718" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Dibujar los contratos antes de escribir el código es lo que convierte «lo parto en servicios» en una decisión que se puede discutir.</text><text x="680" y="742" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Si una flecha no se puede rotular, esa pieza todavía no es un servicio.</text></svg>