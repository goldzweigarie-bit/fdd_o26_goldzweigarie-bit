<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="800" viewBox="0 0 1340 800" role="img" aria-label="El Dockerfile de la carpeta roto con sus cinco lineas a la izquierda y sus tres defectos senalados con insignias numeradas: FROM python:latest sin pinear, el COPY punto punto antes del RUN pip install, y la ausencia de una instruccion USER. A la derecha, una tarjeta por defecto con su consecuencia, con la medicion real que la hace visible —el segundo build baja de 6.53 a 0.41 segundos al reordenar, con una sola dependencia— y con el arreglo concreto: FROM python:3.12-slim, partir el COPY dejando requirements.txt primero, y RUN useradd mas USER. Abajo a la izquierda, el mismo Dockerfile ya arreglado, entero, con las ocho instrucciones en el orden correcto"><rect x="0" y="0" width="1340" height="800" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Los tres defectos del Dockerfile de roto/</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cada uno con la medición que lo hace visible, no con una opinión</text><rect x="50" y="104" width="470" height="258" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="285" y="134" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">roto/Dockerfile</text><text x="74" y="168" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">FROM python:latest</text><circle cx="496" cy="163" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="496" y="168" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1</text><text x="74" y="198" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">WORKDIR /app</text><text x="74" y="228" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">COPY . .</text><circle cx="496" cy="223" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="496" y="228" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2</text><text x="74" y="258" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">RUN pip install -r requirements.txt</text><text x="74" y="288" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">CMD ["python", "app.py"]</text><rect x="70" y="302" width="398" height="40" rx="6" fill="none" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="7 7"/><text x="84" y="328" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">(aquí no hay ningún USER)</text><circle cx="496" cy="322" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="496" y="327" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3</text><rect x="50" y="392" width="470" height="306" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="285" y="422" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el mismo archivo, arreglado</text><text x="74" y="456" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">FROM python:3.12-slim</text><text x="74" y="486" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">WORKDIR /app</text><text x="74" y="516" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">COPY requirements.txt .</text><text x="74" y="546" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">RUN pip install -r requirements.txt</text><text x="74" y="576" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">COPY . .</text><text x="74" y="606" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">RUN useradd -m app &amp;&amp; chown -R app /app</text><text x="74" y="636" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">USER app</text><text x="74" y="666" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">CMD ["python", "app.py"]</text><rect x="560" y="104" width="740" height="208" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><circle cx="590" cy="134" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="590" y="139" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1</text><text x="616" y="139" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">FROM python:latest — sin pinear</text><line x1="580" y1="156" x2="1280" y2="156" stroke="#4a7a63" stroke-width="1"/><text x="580" y="180" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">consecuencia</text><text x="704" y="180" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la imagen de hoy no es la de mañana: latest se mueve</text><text x="580" y="206" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">cómo se mide</text><text x="704" y="206" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">construye hoy y dentro de un mes: otro digest y otro Python</text><text x="580" y="234" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">el arreglo</text><text x="704" y="234" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">FROM python:3.12-slim</text><rect x="560" y="324" width="740" height="208" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><circle cx="590" cy="354" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="590" y="359" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2</text><text x="616" y="359" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">COPY . .  antes del  RUN pip install</text><line x1="580" y1="376" x2="1280" y2="376" stroke="#4a7a63" stroke-width="1"/><text x="580" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">consecuencia</text><text x="704" y="400" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">cada cambio de una línea de código tira el caché de instalación</text><text x="580" y="426" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">cómo se mide</text><text x="704" y="426" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el segundo build tras tocar app.py: 6.53 s contra 0.41 s</text><text x="704" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">medido con una sola dependencia pequeña, requests: la brecha crece con</text><text x="704" y="463" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">el número de paquetes — con pandas y compañía son minutos contra segundos</text><text x="580" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">el arreglo</text><text x="704" y="480" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">COPY requirements.txt .</text><text x="704" y="500" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">RUN pip install -r requirements.txt</text><text x="704" y="520" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">COPY . .</text><rect x="560" y="544" width="740" height="208" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><circle cx="590" cy="574" r="13" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="590" y="579" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3</text><text x="616" y="579" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">no hay ninguna instrucción USER</text><line x1="580" y1="596" x2="1280" y2="596" stroke="#4a7a63" stroke-width="1"/><text x="580" y="620" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">consecuencia</text><text x="704" y="620" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el proceso corre como root, y lo que escribe en el bind mount queda de root</text><text x="580" y="646" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">cómo se mide</text><text x="704" y="646" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">ls -l del archivo que escribió: owner root, y no lo puedes borrar</text><text x="580" y="674" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">el arreglo</text><text x="704" y="674" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">RUN useradd -m app &amp;&amp; chown -R app /app</text><text x="704" y="694" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">USER app</text><text x="670" y="776" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Ninguno de los tres es una cuestión de gusto: los tres se comprueban con un comando, y por eso se pueden corregir sin discutir.</text></svg>