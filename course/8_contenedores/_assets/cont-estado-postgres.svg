<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="750" viewBox="0 0 1340 750" role="img" aria-label="Cuatro tiempos de la misma linea, de izquierda a derecha. Primero, un contenedor postgres:16 con un named volume llamado pgdata montado en /var/lib/postgresql/data y una tabla con su fila recien insertada. Despues, el contenedor destruido con docker rm -f y el volumen quedando solo en el dibujo, con los datos adentro. Luego, un contenedor nuevo montando el mismo volumen y leyendo la misma fila, sin inicializar nada. Y al final, docker volume rm pgdata, donde los datos si mueren. Un recuadro marca dos decisiones de la pagina: aqui no se publica puerto, se entra con docker exec, y el volumen es named y no bind mount por los permisos del uid 999 y por la portabilidad"><rect x="0" y="0" width="1340" height="750" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El estado sobrevive a su contenedor</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cuatro tiempos de la misma línea, con un named volume de por medio</text><rect x="40" y="128" width="286" height="412" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="183" y="158" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">1 · corriendo, con su volumen</text><text x="183" y="182" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">-v pgdata:/var/lib/postgresql/data</text><rect x="62" y="200" width="242" height="78" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="183" y="232" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">postgres:16</text><text x="183" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el contenedor pg</text><line x1="183" y1="282" x2="183" y2="314" stroke="#7ef29d" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#f7ef29d)"/><text x="197" y="304" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">monta</text><rect x="62" y="320" width="242" height="132" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="183" y="348" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pgdata</text><text x="183" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">named volume</text><text x="183.0" y="398" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">id │ nombre</text><line x1="86" y1="406" x2="280" y2="406" stroke="#4a7a63" stroke-width="1"/><text x="183.0" y="426" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">1  │ ada</text><text x="183" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">INSERT y COMMIT. La fila no vive</text><text x="183" y="499" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">en el contenedor: vive en el</text><text x="183" y="518" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">volumen, que es otra cosa.</text><rect x="366" y="128" width="286" height="412" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="509" y="158" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">2 · se destruye el contenedor</text><text x="509" y="182" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">docker rm -f pg</text><rect x="388" y="200" width="242" height="78" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><text x="509" y="232" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">postgres:16</text><text x="509" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el contenedor pg</text><line x1="408" y1="228" x2="610" y2="228" stroke="#ff8a7a" stroke-width="2.5"/><line x1="606" y1="204" x2="626" y2="224" stroke="#ff8a7a" stroke-width="3"/><line x1="606" y1="224" x2="626" y2="204" stroke="#ff8a7a" stroke-width="3"/><rect x="388" y="320" width="242" height="132" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="509" y="348" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pgdata</text><text x="509" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">named volume</text><text x="509.0" y="398" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">id │ nombre</text><line x1="412" y1="406" x2="606" y2="406" stroke="#4a7a63" stroke-width="1"/><text x="509.0" y="426" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">1  │ ada</text><text x="509" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Se va su capa de escritura y se</text><text x="509" y="499" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">va su nombre. El volumen sigue</text><text x="509" y="518" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">entero, con la fila adentro.</text><line x1="332" y1="334" x2="360" y2="334" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="692" y="128" width="286" height="412" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="835" y="158" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">3 · otro contenedor, mismo volumen</text><text x="835" y="182" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">docker run --name pg2 -v pgdata:…</text><rect x="714" y="200" width="242" height="78" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="835" y="232" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">postgres:16</text><text x="835" y="254" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">el contenedor pg2</text><line x1="835" y1="282" x2="835" y2="314" stroke="#7ef29d" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#f7ef29d)"/><text x="849" y="304" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">monta</text><rect x="714" y="320" width="242" height="132" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="835" y="348" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pgdata</text><text x="835" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">named volume</text><text x="835.0" y="398" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">id │ nombre</text><line x1="738" y1="406" x2="932" y2="406" stroke="#4a7a63" stroke-width="1"/><text x="835.0" y="426" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">1  │ ada</text><text x="835" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">SELECT devuelve la misma fila.</text><text x="835" y="499" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Postgres no inicializó nada: el</text><text x="835" y="518" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">volumen ya venía inicializado.</text><line x1="658" y1="334" x2="686" y2="334" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="1018" y="128" width="286" height="412" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="1161" y="158" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">4 · y aquí sí mueren los datos</text><text x="1161" y="182" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">docker volume rm pgdata</text><rect x="1040" y="200" width="242" height="78" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><text x="1161" y="244" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">(ya no hay contenedor)</text><rect x="1040" y="320" width="242" height="132" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="1161" y="348" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">pgdata</text><text x="1161" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">named volume</text><text x="1161.0" y="398" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">id │ nombre</text><line x1="1064" y1="406" x2="1258" y2="406" stroke="#4a7a63" stroke-width="1"/><text x="1161.0" y="426" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">1  │ ada</text><line x1="1080" y1="422" x2="1242" y2="422" stroke="#ff8a7a" stroke-width="2"/><line x1="1258" y1="324" x2="1278" y2="344" stroke="#ff8a7a" stroke-width="3"/><line x1="1258" y1="344" x2="1278" y2="324" stroke="#ff8a7a" stroke-width="3"/><text x="1161" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Es el único de los cuatro</text><text x="1161" y="499" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">comandos que se lleva el dato.</text><text x="1161" y="518" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y no hay deshacer.</text><line x1="984" y1="334" x2="1012" y2="334" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="40" y="572" width="630" height="122" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="60" y="602" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">aquí no se publica ningún puerto</text><text x="60" y="630" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start">docker exec -it pg psql -U postgres</text><text x="60" y="654" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Un -p 5432:5432 pondría Postgres en tu red local sin que nadie lo</text><text x="60" y="672" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">necesite. Entrar por exec es entrar por la puerta que ya existe.</text><rect x="690" y="572" width="630" height="122" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="710" y="602" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">y el volumen es named, no bind mount</text><text x="710" y="630" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Postgres corre como el uid 999, y un bind mount a tu carpeta le negaría</text><text x="710" y="648" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">el permiso de escribir en su propio directorio de datos. El named volume</text><text x="710" y="666" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">además es el mismo comando en Linux, en macOS y en Windows.</text><text x="670" y="726" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Un contenedor es desechable porque el dato no vive en él. Cuál de los dos borras no es un detalle: es la diferencia entre rehacer y perder.</text></svg>