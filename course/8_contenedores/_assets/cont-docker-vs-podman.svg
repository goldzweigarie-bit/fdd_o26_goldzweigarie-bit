<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="770" viewBox="0 0 1260 770" role="img" aria-label="Las dos cadenas, una sobre otra. Arriba, docker CLI hablando por un socket con dockerd, marcado como proceso privilegiado siempre encendido, y de ahi containerd, el shim y runc. Abajo, podman, que hace fork-exec directo de conmon y de crun o runc y no deja nada permanente, con su caja de lo que si necesita rootless: rango en subuid y subgid y los binarios newuidmap y newgidmap. Un recuadro desarma el mito del doble de velocidad con tres barras medidas"><rect x="0" y="0" width="1260" height="770" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="630" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Docker y Podman: la diferencia es arquitectónica</text><text x="630" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">qué compra exactamente no tener daemon</text><text x="50" y="106" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">Docker — con daemon</text><text x="209" y="134" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">/var/run/docker.sock</text><rect x="50" y="148" width="130" height="78" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="115.0" y="180" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">docker</text><text x="115.0" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">lo que tecleas</text><line x1="184" y1="187" x2="232" y2="187" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="238" y="148" width="150" height="78" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="313.0" y="180" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">dockerd</text><text x="313.0" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">root · siempre encendido</text><line x1="392" y1="187" x2="440" y2="187" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="446" y="148" width="165" height="78" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="528.5" y="180" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">containerd</text><text x="528.5" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">imágenes y tareas</text><line x1="615" y1="187" x2="663" y2="187" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="669" y="148" width="226" height="78" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="782.0" y="180" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">containerd-shim-runc-v2</text><text x="782.0" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">supervisor</text><line x1="899" y1="187" x2="947" y2="187" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="953" y="148" width="120" height="78" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="1013.0" y="180" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">runc</text><text x="1013.0" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">crea y se va</text><rect x="195.0" y="238" width="236" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="313" y="257" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">proceso privilegiado</text><line x1="782" y1="228" x2="782" y2="246" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="669" y="250" width="226" height="62" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="782" y="274" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el proceso del contenedor</text><text x="782" y="294" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">cuelga del shim</text><line x1="40" y1="330" x2="1220" y2="330" stroke="#4a7a63" stroke-width="1.5" stroke-dasharray="6 6"/><text x="50" y="366" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">Podman — sin daemon, rootless</text><rect x="50" y="396" width="150" height="78" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="125.0" y="428" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">podman</text><text x="125.0" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">tu propio proceso</text><line x1="204" y1="435" x2="252" y2="435" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="228" y="382" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">fork-exec</text><rect x="258" y="396" width="165" height="78" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="340.5" y="428" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">conmon</text><text x="340.5" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">supervisor, como el shim</text><line x1="427" y1="435" x2="475" y2="435" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="451" y="382" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">fork-exec</text><rect x="481" y="396" width="200" height="78" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="581.0" y="428" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">crun (o runc)</text><text x="581.0" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">crea y se va</text><rect x="34.5" y="488" width="181" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="125" y="507" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">nada permanente</text><line x1="340" y1="476" x2="340" y2="494" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="258" y="498" width="165" height="62" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="340" y="522" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el proceso</text><text x="340" y="542" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">cuelga de conmon</text><rect x="730" y="380" width="500" height="175" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="750" y="410" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">lo que rootless SÍ necesita</text><text x="750" y="440" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">· un rango propio en /etc/subuid y /etc/subgid</text><text x="750" y="466" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">· los binarios newuidmap y newgidmap</text><text x="766" y="490" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">en Debian y Ubuntu vienen en el paquete uidmap,</text><text x="766" y="508" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">que es Recommends y falta en instalaciones mínimas</text><text x="750" y="536" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">sin eso:</text><text x="806" y="536" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">cannot find UID in /etc/subuid</text><rect x="50" y="580" width="1180" height="118" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="70" y="608" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">El mito del 2×, desarmado: fijando todo menos el runtime</text><text x="70" y="630" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">podman --runtime crun</text><rect x="310.0" y="617.0" width="403.5" height="17.0" rx="4" fill="#7ef29d"/><text x="723.4852546916891" y="630" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">215 ms</text><text x="70" y="654" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker (runtime runc)</text><rect x="310.0" y="641.0" width="677.5" height="17.0" rx="4" fill="#6fd8e8"/><text x="997.4798927613941" y="654" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">361 ms</text><text x="70" y="678" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">podman --runtime runc</text><rect x="310.0" y="665.0" width="700.0" height="17.0" rx="4" fill="#ff8a7a"/><text x="1020.0" y="678" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">373 ms</text><text x="630" y="722" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Con el runtime igualado, Podman rootless no gana: sale ~3 % detrás de Docker. Lo que compra la ausencia de daemon no es velocidad:</text><text x="630" y="744" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">es rootless, integración con systemd y ningún proceso privilegiado siempre encendido.</text></svg>