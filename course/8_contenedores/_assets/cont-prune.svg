<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-label="El mismo disco dibujado como cuatro montones: las imagenes, partidas en las que tienen un contenedor corriendo y las que no usa nadie; los contenedores detenidos; las capas huerfanas; y los volumenes sin dueno. Debajo, una brocha por comando marca exactamente que se lleva cada uno: docker container prune solo los contenedores detenidos, docker image prune las capas huerfanas, docker image prune -a ademas las imagenes que nadie usa, y docker system prune -a todo lo anterior. Resaltado en rojo, el aviso de que los volumenes no entran en ninguno y se piden aparte: docker volume prune y docker system prune --volumes solo borran los anonimos, y los que tienen nombre piden docker volume prune -a. Arriba a la izquierda, docker system df como el comando que mide antes de borrar, con sus columnas TYPE, SIZE y RECLAIMABLE. Abajo a la derecha, que una imagen con un contenedor corriendo no es candidata para ningun prune, y que si el contenedor esta detenido image prune -a la respeta pero system prune -a borra primero el contenedor y despues se la lleva"><rect x="0" y="0" width="1360" height="800" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="680" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué se lleva exactamente cada prune</text><text x="680" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cuatro montones en el disco, y una brocha por comando</text><rect x="40" y="150" width="210" height="170" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="145" y="178" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">mide antes de borrar</text><text x="145" y="204" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">docker system df</text><line x1="58" y1="218" x2="232" y2="218" stroke="#4a7a63" stroke-width="1"/><text x="52" y="240" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">TYPE</text><text x="166" y="240" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">SIZE</text><text x="240" y="240" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">RECLAIMABLE</text><text x="52" y="262" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">Images</text><text x="166" y="262" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">8.8G</text><text x="240" y="262" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">6.7G</text><text x="52" y="284" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">Containers</text><text x="166" y="284" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">380M</text><text x="240" y="284" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">380M</text><text x="52" y="306" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">Local Volumes</text><text x="166" y="306" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">3.4G</text><text x="240" y="306" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">3.4G</text><line x1="270" y1="136" x2="674" y2="136" stroke="#c9a7ff" stroke-width="1.5"/><line x1="270" y1="136" x2="270" y2="148" stroke="#c9a7ff" stroke-width="1.5"/><line x1="674" y1="136" x2="674" y2="148" stroke="#c9a7ff" stroke-width="1.5"/><text x="472" y="128" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">imágenes</text><rect x="270" y="152" width="192" height="118" rx="8" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.5"/><rect x="284.0" y="239.0" width="164.0" height="13.0" rx="3" fill="#7ef29d"/><rect x="284.0" y="222.0" width="164.0" height="13.0" rx="3" fill="#7ef29d"/><rect x="284.0" y="205.0" width="164.0" height="13.0" rx="3" fill="#7ef29d"/><rect x="284.0" y="188.0" width="164.0" height="13.0" rx="3" fill="#7ef29d"/><text x="366" y="292" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">2.1 GB</text><text x="366" y="314" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">con un contenedor</text><text x="366" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">corriendo</text><rect x="482" y="152" width="192" height="118" rx="8" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.5"/><rect x="496.0" y="239.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><rect x="496.0" y="222.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><rect x="496.0" y="205.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><rect x="496.0" y="188.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><rect x="496.0" y="171.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><rect x="496.0" y="154.0" width="164.0" height="13.0" rx="3" fill="#c9a7ff"/><text x="578" y="292" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">4.8 GB</text><text x="578" y="314" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">que nadie usa</text><text x="578" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">—</text><rect x="694" y="152" width="192" height="118" rx="8" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.5"/><rect x="708.0" y="239.0" width="164.0" height="13.0" rx="3" fill="#6fd8e8"/><rect x="708.0" y="222.0" width="164.0" height="13.0" rx="3" fill="#6fd8e8"/><rect x="708.0" y="205.0" width="164.0" height="13.0" rx="3" fill="#6fd8e8"/><text x="790" y="292" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">380 MB</text><text x="790" y="314" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">contenedores</text><text x="790" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">detenidos</text><rect x="906" y="152" width="192" height="118" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="1.5"/><rect x="920.0" y="239.0" width="164.0" height="13.0" rx="3" fill="#ffc857"/><rect x="920.0" y="222.0" width="164.0" height="13.0" rx="3" fill="#ffc857"/><rect x="920.0" y="205.0" width="164.0" height="13.0" rx="3" fill="#ffc857"/><rect x="920.0" y="188.0" width="164.0" height="13.0" rx="3" fill="#ffc857"/><text x="1002" y="292" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">1.9 GB</text><text x="1002" y="314" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">capas huérfanas</text><text x="1002" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(dangling)</text><rect x="1118" y="152" width="192" height="118" rx="8" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.5"/><rect x="1132.0" y="239.0" width="164.0" height="13.0" rx="3" fill="#ff8a7a"/><rect x="1132.0" y="222.0" width="164.0" height="13.0" rx="3" fill="#ff8a7a"/><rect x="1132.0" y="205.0" width="164.0" height="13.0" rx="3" fill="#ff8a7a"/><rect x="1132.0" y="188.0" width="164.0" height="13.0" rx="3" fill="#ff8a7a"/><text x="1214" y="292" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">3.4 GB</text><text x="1214" y="314" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">volúmenes</text><text x="1214" y="332" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">sin dueño</text><text x="40" y="384" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker container prune</text><line x1="40" y1="400" x2="1310" y2="400" stroke="#4a7a63" stroke-width="1"/><text x="366" y="382" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="578" y="382" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><rect x="700.0" y="362.0" width="180.0" height="30.0" rx="15" fill="#6fd8e8"/><text x="790" y="382" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><text x="1002" y="382" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="1214" y="382" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="40" y="444" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker image prune</text><line x1="40" y1="460" x2="1310" y2="460" stroke="#4a7a63" stroke-width="1"/><text x="366" y="442" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="578" y="442" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="790" y="442" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><rect x="912.0" y="422.0" width="180.0" height="30.0" rx="15" fill="#ffc857"/><text x="1002" y="442" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><text x="1214" y="442" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="40" y="504" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker image prune -a</text><line x1="40" y1="520" x2="1310" y2="520" stroke="#4a7a63" stroke-width="1"/><text x="366" y="502" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><rect x="488.0" y="482.0" width="180.0" height="30.0" rx="15" fill="#c9a7ff"/><text x="578" y="502" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><text x="790" y="502" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><rect x="912.0" y="482.0" width="180.0" height="30.0" rx="15" fill="#c9a7ff"/><text x="1002" y="502" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><text x="1214" y="502" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="40" y="564" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">docker system prune -a</text><line x1="40" y1="580" x2="1310" y2="580" stroke="#4a7a63" stroke-width="1"/><text x="366" y="562" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><rect x="488.0" y="542.0" width="180.0" height="30.0" rx="15" fill="#e8f0e8"/><text x="578" y="562" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><rect x="700.0" y="542.0" width="180.0" height="30.0" rx="15" fill="#e8f0e8"/><text x="790" y="562" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><rect x="912.0" y="542.0" width="180.0" height="30.0" rx="15" fill="#e8f0e8"/><text x="1002" y="562" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">se lo lleva</text><text x="1214" y="562" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">—</text><text x="40" y="618" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">sin el -a, docker system prune se salta las imágenes que nadie usa: de ese lado sólo se lleva las capas huérfanas.</text><rect x="40" y="640" width="640" height="122" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="60" y="670" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">los volúmenes NO entran en ninguno de los cuatro</text><text x="60" y="696" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker volume prune · system prune --volumes</text><text x="660" y="696" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">sólo los anónimos</text><text x="60" y="720" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker volume prune -a</text><text x="660" y="720" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">también los que tienen nombre</text><text x="60" y="746" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Se piden aparte, a propósito: aquí borrar es perder un dato, no rehacer un build.</text><rect x="700" y="640" width="620" height="122" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="720" y="670" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">y nada de esto toca lo que está en uso</text><text x="720" y="698" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Una imagen con un contenedor corriendo no es candidata para ningún prune.</text><text x="720" y="716" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Si el contenedor está detenido, image prune -a la respeta, pero system</text><text x="720" y="734" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">prune -a borra primero el contenedor y después se la lleva.</text><text x="680" y="786" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cada montón tiene su columna, y docker system df te dice antes cuánto vas a recuperar.</text></svg>