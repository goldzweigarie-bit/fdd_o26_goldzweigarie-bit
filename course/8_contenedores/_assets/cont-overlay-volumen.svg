<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="970" viewBox="0 0 1300 970" role="img" aria-label="Corte de un contenedor por capas. Abajo del todo, las capas de solo lectura de la imagen, que las escribe docker build y mueren con docker rmi; encima, la capa de escritura, que la escribe el proceso de adentro y muere con docker rm; entre las dos, la flecha de copy-up que marca que la primera escritura sobre un archivo que venia de una capa inferior lo copia entero hacia arriba. Entrando de lado, un bind mount montado en barra app que sale al disco del host, lo escriben los dos lados y no muere nunca porque es tu disco, y un named volume montado en el directorio de datos de Postgres que vive en el area de Docker, lo escribe el contenedor y muere con docker volume rm. Al pie, la tabla de las cuatro: donde vive el byte, quien lo escribe, que lo borra y si sobrevive a un docker rm"><rect x="0" y="0" width="1300" height="970" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="650" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Dónde vive cada byte que escribe un contenedor</text><text x="650" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cuatro lugares posibles, y cada uno muere con un comando distinto</text><rect x="340" y="108" width="520" height="512" rx="10" fill="none" stroke="#4a7a63" stroke-width="2"/><text x="600" y="138" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">lo que el proceso ve colgando de  /</text><text x="370" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">overlayfs</text><rect x="370" y="182" width="460" height="62" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><text x="600" y="208" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">la capa de escritura</text><text x="600" y="230" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la escribe el proceso  ·  muere con docker rm</text><line x1="430" y1="306" x2="430" y2="250" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><text x="452" y="274" fill="#ffc857" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">copy-up: la primera vez que escribes un</text><text x="452" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">archivo que venía de abajo, se copia entero</text><rect x="370" y="310" width="460" height="38" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="1.8"/><text x="600" y="335" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="middle">COPY . .</text><rect x="370" y="354" width="460" height="38" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="1.8"/><text x="600" y="379" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="middle">RUN pip install -r requirements.txt</text><rect x="370" y="398" width="460" height="38" rx="8" fill="#141b20" stroke="#c9a7ff" stroke-width="1.8"/><text x="600" y="423" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="middle">FROM python:3.12-slim</text><line x1="356" y1="310" x2="356" y2="436" stroke="#c9a7ff" stroke-width="2.5"/><line x1="356" y1="310" x2="366" y2="310" stroke="#c9a7ff" stroke-width="2.5"/><line x1="356" y1="436" x2="366" y2="436" stroke="#c9a7ff" stroke-width="2.5"/><text x="600" y="456" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">las capas de la imagen  ·  sólo lectura</text><text x="600" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">las escribe docker build  ·  mueren con docker rmi</text><line x1="360" y1="494" x2="840" y2="494" stroke="#4a7a63" stroke-width="1" stroke-dasharray="6 6"/><text x="600" y="514" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y colgando aparte, dos rutas montadas:</text><rect x="370" y="526" width="460" height="40" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="1.8"/><text x="600" y="552" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">/app</text><rect x="370" y="574" width="460" height="40" rx="8" fill="#141b20" stroke="#ffc857" stroke-width="1.8"/><text x="600" y="600" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">/var/lib/postgresql/data</text><rect x="40" y="464" width="276" height="156" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="178" y="494" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">tu disco, el del host</text><text x="178" y="518" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="middle">~/fdd/docker-lab/app</text><text x="178" y="544" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">bind mount</text><text x="58" y="570" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo escriben los dos lados</text><text x="58" y="587" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">no muere nunca: es tu disco</text><text x="58" y="604" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">docker rm no lo toca</text><line x1="320" y1="546" x2="366" y2="546" stroke="#6fd8e8" stroke-width="2.5" marker-end="url(#f6fd8e8)"/><rect x="884" y="512" width="296" height="156" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="1032" y="542" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el área de Docker</text><text x="1032" y="566" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">/var/lib/docker/volumes/</text><text x="1032" y="592" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">named volume</text><text x="902" y="618" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo escribe el contenedor</text><text x="902" y="635" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sobrevive a docker rm</text><text x="902" y="652" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">muere con docker volume rm</text><line x1="880" y1="594" x2="834" y2="594" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><text x="650" y="700" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">la tabla que ordena toda la clase</text><text x="70" y="738" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">dónde vive el byte</text><text x="420" y="738" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">quién lo escribe</text><text x="740" y="738" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">qué lo borra</text><text x="1040" y="738" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">¿sobrevive a docker rm?</text><line x1="50" y1="750" x2="1250" y2="750" stroke="#4a7a63" stroke-width="1.5"/><rect x="50.0" y="768.0" width="8.0" height="22.0" rx="3" fill="#c9a7ff"/><text x="70" y="784" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">capas de la imagen</text><text x="420" y="784" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">docker build</text><text x="740" y="784" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker rmi</text><text x="1040" y="784" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">sí</text><rect x="50.0" y="806.0" width="8.0" height="22.0" rx="3" fill="#7ef29d"/><text x="70" y="822" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">la capa de escritura</text><text x="420" y="822" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el proceso de adentro</text><text x="740" y="822" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker rm</text><text x="1040" y="822" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">NO</text><rect x="50.0" y="844.0" width="8.0" height="22.0" rx="3" fill="#6fd8e8"/><text x="70" y="860" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">bind mount</text><text x="420" y="860" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el host y el contenedor</text><text x="740" y="860" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">tú, borrando el archivo</text><text x="1040" y="860" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">sí</text><rect x="50.0" y="882.0" width="8.0" height="22.0" rx="3" fill="#ffc857"/><text x="70" y="898" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">named volume</text><text x="420" y="898" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">el contenedor</text><text x="740" y="898" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">docker volume rm</text><text x="1040" y="898" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">sí</text><text x="650" y="944" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La pregunta nunca es «¿se guardó?»: es «¿en cuál de estos cuatro se guardó?». De ahí sale, sin adivinar, qué comando se lo lleva.</text></svg>