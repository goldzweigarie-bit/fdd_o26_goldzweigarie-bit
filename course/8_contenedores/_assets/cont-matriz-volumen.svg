<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-label="La matriz de ocho casos del laboratorio, dibujada como un arbol de tres decisiones binarias: el codigo dentro de la imagen o montado por volumen, la edicion hecha en el host o dentro del contenedor, y con docker build de por medio o sin el. Cada una de las ocho hojas dice si el cambio se ve al correr y si sobrevive a un docker rm. Las cuatro hojas de la rama del volumen van resaltadas y agrupadas bajo la conclusion que cierra la pagina: con volumen, editar fuera y ver dentro no necesita ningun rebuild"><rect x="0" y="0" width="1400" height="830" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="700" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Los ocho casos, como tres decisiones</text><text x="700" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">predice antes de ejecutar: el árbol da las ocho respuestas sin correr nada</text><text x="1240" y="94" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">¿se ve</text><text x="1240" y="110" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">al correr?</text><text x="1332" y="94" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">¿sobrevive</text><text x="1332" y="110" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">a docker rm?</text><rect x="50" y="369" width="170" height="62" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="135" y="396" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">cambias una línea</text><text x="135" y="416" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">de app.py</text><line x1="220" y1="400" x2="240" y2="400" stroke="#4a7a63" stroke-width="2"/><line x1="240" y1="260" x2="240" y2="540" stroke="#4a7a63" stroke-width="2"/><line x1="240" y1="260" x2="258" y2="260" stroke="#4a7a63" stroke-width="2"/><rect x="262" y="226" width="190" height="68" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="357" y="256" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">en la IMAGEN</text><text x="357" y="278" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">el Dockerfile hace COPY . .</text><line x1="240" y1="540" x2="258" y2="540" stroke="#4a7a63" stroke-width="2"/><rect x="262" y="506" width="190" height="68" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="357" y="536" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">por VOLUMEN</text><text x="357" y="558" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle">-v "$(pwd)":/app</text><line x1="452" y1="260" x2="470" y2="260" stroke="#4a7a63" stroke-width="2"/><line x1="470" y1="190" x2="470" y2="330" stroke="#4a7a63" stroke-width="2"/><line x1="452" y1="540" x2="470" y2="540" stroke="#4a7a63" stroke-width="2"/><line x1="470" y1="470" x2="470" y2="610" stroke="#4a7a63" stroke-width="2"/><line x1="470" y1="190" x2="488" y2="190" stroke="#4a7a63" stroke-width="2"/><rect x="492" y="164" width="172" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="578" y="195" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">editas en el HOST</text><line x1="470" y1="330" x2="488" y2="330" stroke="#4a7a63" stroke-width="2"/><rect x="492" y="304" width="172" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="578" y="335" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">editas DENTRO</text><line x1="470" y1="470" x2="488" y2="470" stroke="#4a7a63" stroke-width="2"/><rect x="492" y="444" width="172" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="578" y="475" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">editas en el HOST</text><line x1="470" y1="610" x2="488" y2="610" stroke="#4a7a63" stroke-width="2"/><rect x="492" y="584" width="172" height="52" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="578" y="615" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">editas DENTRO</text><line x1="664" y1="190" x2="682" y2="190" stroke="#4a7a63" stroke-width="2"/><line x1="682" y1="155" x2="682" y2="225" stroke="#4a7a63" stroke-width="2"/><line x1="664" y1="330" x2="682" y2="330" stroke="#4a7a63" stroke-width="2"/><line x1="682" y1="295" x2="682" y2="365" stroke="#4a7a63" stroke-width="2"/><line x1="664" y1="470" x2="682" y2="470" stroke="#4a7a63" stroke-width="2"/><line x1="682" y1="435" x2="682" y2="505" stroke="#4a7a63" stroke-width="2"/><line x1="664" y1="610" x2="682" y2="610" stroke="#4a7a63" stroke-width="2"/><line x1="682" y1="575" x2="682" y2="645" stroke="#4a7a63" stroke-width="2"/><line x1="682" y1="155" x2="700" y2="155" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="141" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="750" y="160" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">con build</text><line x1="806" y1="155" x2="830" y2="155" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="126" width="524" height="58" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="852" y="151" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">El rebuild mete tu cambio en una capa nueva.</text><text x="852" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Hay que reconstruir Y volver a correr: dos pasos.</text><line x1="1231" y1="155" x2="1237.75" y2="161.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="161.3" x2="1249" y2="147.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="155" x2="1329.75" y2="161.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="161.3" x2="1341" y2="147.8" stroke="#7ef29d" stroke-width="3"/><line x1="682" y1="225" x2="700" y2="225" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="211" width="115" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="750" y="230" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sin build</text><line x1="806" y1="225" x2="830" y2="225" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="196" width="524" height="58" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="852" y="221" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">La imagen sigue siendo la de antes: el contenedor corre</text><text x="852" y="240" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">el código viejo. Tu edición existe, pero sólo en tu disco.</text><line x1="1231" y1="216" x2="1249" y2="234" stroke="#ff8a7a" stroke-width="3"/><line x1="1231" y1="234" x2="1249" y2="216" stroke="#ff8a7a" stroke-width="3"/><line x1="1323" y1="225" x2="1329.75" y2="231.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="231.3" x2="1341" y2="217.8" stroke="#7ef29d" stroke-width="3"/><line x1="682" y1="295" x2="700" y2="295" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="281" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="750" y="300" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">con build</text><line x1="806" y1="295" x2="830" y2="295" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="266" width="524" height="58" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="852" y="291" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">El build lee el contexto del host, no la capa de escritura:</text><text x="852" y="310" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">tu edición de adentro no entra nunca a la imagen nueva.</text><line x1="1231" y1="286" x2="1249" y2="304" stroke="#ff8a7a" stroke-width="3"/><line x1="1231" y1="304" x2="1249" y2="286" stroke="#ff8a7a" stroke-width="3"/><line x1="1323" y1="286" x2="1341" y2="304" stroke="#ff8a7a" stroke-width="3"/><line x1="1323" y1="304" x2="1341" y2="286" stroke="#ff8a7a" stroke-width="3"/><line x1="682" y1="365" x2="700" y2="365" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="351" width="115" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="750" y="370" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sin build</text><line x1="806" y1="365" x2="830" y2="365" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="336" width="524" height="58" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="852" y="361" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Se ve ya, en ese contenedor. Vive en la capa de escritura,</text><text x="852" y="380" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y docker rm se la lleva entera sin preguntar.</text><line x1="1231" y1="365" x2="1237.75" y2="371.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="371.3" x2="1249" y2="357.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="356" x2="1341" y2="374" stroke="#ff8a7a" stroke-width="3"/><line x1="1323" y1="374" x2="1341" y2="356" stroke="#ff8a7a" stroke-width="3"/><line x1="682" y1="435" x2="700" y2="435" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="421" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="750" y="440" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">con build</text><line x1="806" y1="435" x2="830" y2="435" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="406" width="524" height="58" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="852" y="431" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Se ve al instante — y el build sobró: el volumen tapa</text><text x="852" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">lo que la imagen traiga en ese path, sea nuevo o viejo.</text><line x1="1231" y1="435" x2="1237.75" y2="441.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="441.3" x2="1249" y2="427.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="435" x2="1329.75" y2="441.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="441.3" x2="1341" y2="427.8" stroke="#7ef29d" stroke-width="3"/><line x1="682" y1="505" x2="700" y2="505" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="491" width="115" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="750" y="510" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sin build</text><line x1="806" y1="505" x2="830" y2="505" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="476" width="524" height="58" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="852" y="501" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">La que usas todo el día: guardas el archivo y ya está.</text><text x="852" y="520" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Ni rebuild, ni reinicio, ni docker nada.</text><line x1="1231" y1="505" x2="1237.75" y2="511.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="511.3" x2="1249" y2="497.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="505" x2="1329.75" y2="511.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="511.3" x2="1341" y2="497.8" stroke="#7ef29d" stroke-width="3"/><line x1="682" y1="575" x2="700" y2="575" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="561" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="750" y="580" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">con build</text><line x1="806" y1="575" x2="830" y2="575" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="546" width="524" height="58" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="852" y="571" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Escribir en /app es escribir en tu disco. El build, otra</text><text x="852" y="590" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">vez, no cambió nada que se llegue a ver.</text><line x1="1231" y1="575" x2="1237.75" y2="581.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="581.3" x2="1249" y2="567.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="575" x2="1329.75" y2="581.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="581.3" x2="1341" y2="567.8" stroke="#7ef29d" stroke-width="3"/><line x1="682" y1="645" x2="700" y2="645" stroke="#4a7a63" stroke-width="2"/><rect x="692.5" y="631" width="115" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="750" y="650" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sin build</text><line x1="806" y1="645" x2="830" y2="645" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="836" y="616" width="524" height="58" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="852" y="641" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Escribes en el bind mount: el archivo cambia en tu carpeta</text><text x="852" y="660" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">del host, con el dueño que diga tu plataforma.</text><line x1="1231" y1="645" x2="1237.75" y2="651.3" stroke="#7ef29d" stroke-width="3"/><line x1="1237.75" y1="651.3" x2="1249" y2="637.8" stroke="#7ef29d" stroke-width="3"/><line x1="1323" y1="645" x2="1329.75" y2="651.3" stroke="#7ef29d" stroke-width="3"/><line x1="1329.75" y1="651.3" x2="1341" y2="637.8" stroke="#7ef29d" stroke-width="3"/><line x1="1376" y1="406" x2="1376" y2="674" stroke="#7ef29d" stroke-width="3"/><rect x="40" y="700" width="1320" height="62" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><text x="700" y="727" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Con volumen, editar fuera y ver dentro no necesita ningún rebuild: las cuatro hojas de esa rama se ven y sobreviven.</text><text x="700" y="750" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">En la rama de la imagen, en cambio, la respuesta cambia en cada hoja — y eso es exactamente lo que se practica.</text><text x="700" y="800" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La segunda columna no pregunta si el archivo existe: pregunta dónde vive. Un cambio en la capa de escritura se ve igual de bien… hasta el docker rm.</text></svg>