ly="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">El sort sale al revés, +7.6 % en Docker: parte de ese margen es el propio docker exec, que el experimento no midió aparte.</text><text x="520.0" y="604" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Intel Core i7-7700HQ · Linux 6.12 · Docker 28.4.0 · Podman 4.6.2 · imagen ubuntu:24.04 · 5 repeticiones por barra, mediana</text><text x="520.0" y="621" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Herramientas medidas: GNU coreutils 8.32 en el host contra GNU coreutils 9.4 dentro de la imagen</text></svg>