<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-label="Cadena de cinco cajas: docker CLI, dockerd, containerd, containerd-shim-runc-v2 y runc, con el socket rotulado sobre la primera flecha. El proceso del contenedor cuelga del shim y no del daemon, y una flecha punteada sube del shim a PID 1 porque se desacopla con un doble fork. runc va en gris con marca de salida: corre en create y en start y sale las dos veces. Dos llamadas corrigen que el rootfs lo monta dockerd con overlay2 y que el cgroup lo crea systemd por D-Bus. Al pie, el orden real: proceso, cgroup, namespaces"><rect x="0" y="0" width="1280" height="730" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="640" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Qué pasa cuando escribes docker run</text><text x="640" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la cadena real, y qué queda de ella cuando el contenedor ya corre</text><rect x="770" y="110" width="200" height="46" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="1.5"/><text x="870" y="139" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">PID 1 — systemd</text><line x1="870" y1="196" x2="870" y2="162" stroke="#a7b8ad" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#fa7b8ad)"/><text x="986" y="130" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">doble fork: el shim se desacopla</text><text x="986" y="148" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y queda reparentado a systemd</text><rect x="102" y="200" width="150" height="86" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="177.0" y="234" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">docker</text><text x="177.0" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">lo que tecleas</text><line x1="256" y1="243" x2="306" y2="243" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="312" y="200" width="150" height="86" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="387.0" y="234" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">dockerd</text><text x="387.0" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el daemon (root)</text><line x1="466" y1="243" x2="516" y2="243" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="522" y="200" width="170" height="86" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="607.0" y="234" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">containerd</text><text x="607.0" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">imágenes y tareas</text><line x1="696" y1="243" x2="746" y2="243" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="752" y="200" width="236" height="86" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="870.0" y="234" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">containerd-shim-runc-v2</text><text x="870.0" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">el supervisor del contenedor</text><line x1="992" y1="243" x2="1042" y2="243" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="1048" y="200" width="130" height="86" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="1113.0" y="234" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">runc</text><text x="1113.0" y="258" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">crea y se va</text><text x="282" y="182" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle">/var/run/docker.sock</text><line x1="870" y1="290" x2="870" y2="348" stroke="#7ef29d" stroke-width="2.5" marker-end="url(#f7ef29d)"/><text x="744" y="322" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">cuelga del shim,</text><text x="744" y="340" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">no del daemon</text><rect x="752" y="352" width="236" height="92" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="870" y="378" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el proceso del contenedor</text><text x="870" y="404" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">sleep 300</text><text x="870" y="426" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">PID 1 dentro del contenedor</text><rect x="1072.0" y="298" width="82" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="1113" y="317" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">sale ✗</text><text x="1113" y="346" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">corre dos veces:</text><text x="1113" y="362" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">create y start</text><text x="1113" y="378" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">y sale las dos</text><rect x="50" y="470" width="596" height="130" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="66" y="498" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Dos cosas que se enseñan mal — y que runc NO hace</text><text x="66" y="526" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">· el rootfs ya está en disco desde el pull; lo monta dockerd con el</text><text x="80" y="544" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">graphdriver overlay2 (o el shim, con el image store de containerd)</text><text x="66" y="570" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">· el cgroup lo crea systemd: runc le pide una unidad scope por D-Bus</text><text x="80" y="588" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">y sólo escribe los knobs que systemd no expone</text><rect x="680" y="470" width="550" height="130" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="696" y="498" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">El árbol de procesos, con el contenedor ya corriendo</text><text x="696" y="524" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="start">systemd</text><text x="712" y="544" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="start">└─ containerd-shim-runc-v2</text><text x="744" y="564" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="start">└─ sleep 300</text><text x="696" y="588" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">ni dockerd ni containerd aparecen — y runc tampoco: ya salió</text><text x="50" y="646" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el orden real, dentro de runc:</text><rect x="251.0" y="626" width="170" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="336" y="645" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">1 · el proceso</text><rect x="476.5" y="626" width="159" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="556" y="645" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">2 · el cgroup</text><rect x="693.0" y="626" width="214" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="800" y="645" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">3 · los namespaces</text><line x1="426" y1="640" x2="471" y2="640" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><line x1="640" y1="640" x2="688" y2="640" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="925" y="636" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">primero el PID, después el cgroup —</text><text x="925" y="654" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">para que ningún hijo escape— y al final los namespaces</text><text x="640" y="706" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El camino de ejecución ya no pasa por Docker: cada syscall va directo al kernel. Lo que queda es un supervisor sosteniendo la salida y el código de salida.</text></svg>