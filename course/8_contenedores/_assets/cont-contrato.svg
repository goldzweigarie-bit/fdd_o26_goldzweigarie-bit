<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="800" viewBox="0 0 1340 800" role="img" aria-label="Tres cajas colgando de un mismo contenedor, etiquetadas el puerto que escucha, las variables de entorno que espera y el volumen que necesita, y a la derecha, por cada una, lo que le permite a quien lo consume: por donde hablarle, como configurarlo sin reconstruir la imagen, y que sobrevive a un docker rm. Debajo, el mismo servicio con las tres cajas en blanco y la etiqueta monolito repartido, que es lo que queda cuando el contrato no esta escrito, y una linea que separa el servicio con estado del servicio sin estado, con el aviso de que partir cuesta red, despliegue y depuracion"><rect x="0" y="0" width="1340" height="800" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="670" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El contrato de un servicio</text><text x="670" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tres cosas escritas, y lo que cada una le permite a quien lo consume</text><rect x="50" y="150" width="220" height="316" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2.5"/><text x="160" y="186" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">un servicio</text><text x="160" y="214" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">mi-api:v1</text><text x="72" y="250" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Lo que promete es</text><text x="72" y="270" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">exactamente esto, y</text><text x="72" y="290" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">nada más. Lo que no</text><text x="72" y="310" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">está escrito no es</text><text x="72" y="330" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">parte del trato.</text><text x="160" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y las tres cosas</text><text x="160" y="420" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">caben en un README</text><text x="160" y="446" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">de diez líneas</text><line x1="274" y1="192" x2="316" y2="192" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="322" y="150" width="260" height="84" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="452" y="178" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">el puerto que escucha</text><text x="452" y="208" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">8000/tcp</text><line x1="586" y1="192" x2="628" y2="192" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="634" y="150" width="656" height="84" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="652" y="176" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">por dónde hablarle</text><text x="652" y="198" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Desde la misma red: http://api:8000 — sin saber su IP,</text><text x="652" y="216" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sin publicar nada y sin que a nadie le importe dónde corre.</text><line x1="274" y1="300" x2="316" y2="300" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="322" y="258" width="260" height="84" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="452" y="286" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">las variables que espera</text><text x="452" y="316" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">DB_URL   LOG_LEVEL</text><line x1="586" y1="300" x2="628" y2="300" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="634" y="258" width="656" height="84" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="652" y="284" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">cómo configurarlo sin reconstruir</text><text x="652" y="306" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">La misma imagen en desarrollo y en producción: lo que cambia</text><text x="652" y="324" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">es el entorno, no el artefacto. Sin rebuild de por medio.</text><line x1="274" y1="408" x2="316" y2="408" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="322" y="366" width="260" height="84" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="452" y="394" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">el volumen que necesita</text><text x="452" y="424" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">/data</text><line x1="586" y1="408" x2="628" y2="408" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><rect x="634" y="366" width="656" height="84" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="1.5"/><text x="652" y="392" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">qué sobrevive a un docker rm</text><text x="652" y="414" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Lo que está en /data, y sólo eso. Todo lo demás que el</text><text x="652" y="432" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">proceso escriba se va con la capa de escritura.</text><rect x="50" y="500" width="600" height="228" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="350" y="532" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el mismo servicio, sin contrato escrito</text><rect x="76" y="558" width="160" height="140" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="1.5"/><text x="156" y="600" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">un servicio</text><text x="156" y="626" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">mi-api:v1</text><text x="156" y="656" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">el mismo de arriba</text><line x1="240" y1="580" x2="272" y2="580" stroke="#a7b8ad" stroke-width="1.6" marker-end="url(#fa7b8ad)"/><rect x="278" y="562" width="200" height="36" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><line x1="240" y1="626" x2="272" y2="626" stroke="#a7b8ad" stroke-width="1.6" marker-end="url(#fa7b8ad)"/><rect x="278" y="608" width="200" height="36" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><line x1="240" y1="672" x2="272" y2="672" stroke="#a7b8ad" stroke-width="1.6" marker-end="url(#fa7b8ad)"/><rect x="278" y="654" width="200" height="36" rx="8" fill="none" stroke="#a7b8ad" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="271.0" y="692" width="214" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="378" y="711" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">monolito repartido</text><text x="496" y="578" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Quien lo consume</text><text x="496" y="596" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">tiene que leer tu</text><text x="496" y="614" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">código para saber</text><text x="496" y="632" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">por dónde entrarle,</text><text x="496" y="650" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">y cualquier cambio</text><text x="496" y="668" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">tuyo lo rompe sin</text><text x="496" y="686" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">avisar a nadie.</text><rect x="670" y="500" width="620" height="228" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="980" y="532" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">y la línea que sí importa al partir</text><line x1="980" y1="556" x2="980" y2="692" stroke="#ffc857" stroke-width="1.5" stroke-dasharray="6 6"/><text x="824" y="582" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">servicio SIN estado</text><text x="700" y="606" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Desechable y replicable.</text><text x="700" y="624" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Lo matas y lo repones</text><text x="700" y="642" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">sin pensarlo: partirlo</text><text x="700" y="660" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">cuesta poco.</text><text x="1136" y="582" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">servicio CON estado</text><text x="1000" y="606" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Uno solo, con su volumen.</text><text x="1000" y="624" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Partirlo cuesta red,</text><text x="1000" y="642" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">despliegue y depuración</text><text x="1000" y="660" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">— y casi nunca se parte.</text><text x="670" y="762" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Un microservicio no es «un servicio chico»: es un servicio cuyo contrato cabe en tres líneas y no obliga a nadie a leer su código.</text></svg>