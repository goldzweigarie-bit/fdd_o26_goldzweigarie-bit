<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-label="El contenedor rodeado de sus capas de defensa por omision —seccomp, AppArmor o SELinux, capabilities recortadas y usuario no root— y, atravesandolas, las decisiones que abren un agujero en cada una, dibujadas como brechas rotuladas: --privileged, que abre las cuatro de un golpe, --security-opt seccomp=unconfined, --cap-add SYS_ADMIN, y el socket de Docker montado, que no es un exploit sino entregar el host. Dos casos marcados sostienen la tesis: CVE-2022-0492 funcionaba sin privilegios y aun asi la configuracion por defecto lo tapaba, y Dirty Pipe atraviesa todas las capas porque usa splice y write, que todo contenedor necesita"><rect x="0" y="0" width="1400" height="870" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="700" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Por dónde se sale de un contenedor</text><text x="700" y="68" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un mapa de decisiones mal tomadas: casi ninguna fuga real fue un bug del kernel</text><rect x="200" y="720" width="560" height="56" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><text x="480" y="754" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">el kernel del host — uno solo, el mismo para todos</text><rect x="200" y="240" width="560" height="400" rx="24" fill="none" stroke="#ff8a7a" stroke-width="2.5"/><text x="220" y="268" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">seccomp</text><text x="740" y="268" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">el perfil por omisión bloquea unas 44 syscalls</text><rect x="246" y="286" width="468" height="308" rx="24" fill="none" stroke="#c9a7ff" stroke-width="2.5"/><text x="266" y="314" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">AppArmor / SELinux</text><text x="694" y="314" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">qué del filesystem puede tocar</text><rect x="292" y="332" width="376" height="216" rx="24" fill="none" stroke="#ffc857" stroke-width="2.5"/><text x="312" y="360" fill="#ffc857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">capabilities recortadas</text><text x="648" y="360" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">le quedan unas 14 de las 38</text><rect x="338" y="378" width="284" height="124" rx="24" fill="none" stroke="#6fd8e8" stroke-width="2.5"/><text x="358" y="404" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">usuario no root</text><text x="602" y="404" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end">si la imagen trae USER</text><rect x="384" y="416" width="192" height="48" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2.5"/><text x="480" y="446" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">tu proceso, adentro</text><rect x="333.0" y="422.0" width="10.0" height="36.0" rx="0" fill="#0b0f12"/><rect x="287.0" y="422.0" width="10.0" height="36.0" rx="0" fill="#0b0f12"/><rect x="241.0" y="422.0" width="10.0" height="36.0" rx="0" fill="#0b0f12"/><rect x="195.0" y="422.0" width="10.0" height="36.0" rx="0" fill="#0b0f12"/><line x1="380" y1="440" x2="152" y2="440" stroke="#ff8a7a" stroke-width="3" marker-end="url(#fff8a7a)"/><text x="40" y="416" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="start">--privileged</text><text x="40" y="474" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">Abre las cuatro a la vez:</text><text x="40" y="492" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">es correr como si no</text><text x="40" y="510" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">hubiera contenedor.</text><text x="40" y="528" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">No es «un poco menos</text><text x="40" y="546" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="start">seguro»: es ninguna capa.</text><rect x="320.0" y="543.0" width="120.0" height="10.0" rx="0" fill="#0b0f12"/><line x1="380" y1="548" x2="380" y2="562" stroke="#ff8a7a" stroke-width="2"/><text x="380" y="578" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">--cap-add SYS_ADMIN</text><rect x="645.0" y="635.0" width="110.0" height="10.0" rx="0" fill="#0b0f12"/><line x1="700" y1="640" x2="700" y2="654" stroke="#ff8a7a" stroke-width="2"/><text x="700" y="670" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle">--security-opt seccomp=unconfined</text><text x="586" y="690" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">y las otras tres siguen en pie:</text><text x="586" y="706" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">una brecha abre su capa, no el host</text><line x1="580" y1="440" x2="892" y2="440" stroke="#ff8a7a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#fff8a7a)"/><rect x="767.5" y="426" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="825" y="445" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">el socket</text><text x="825" y="414" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">montado por ti</text><line x1="500" y1="470" x2="500" y2="700" stroke="#c9a7ff" stroke-width="3" marker-end="url(#fc9a7ff)"/><rect x="437.0" y="662" width="126" height="28" rx="6" fill="#0b0f12" stroke="#c9a7ff" stroke-width="1.2"/><text x="500" y="681" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">Dirty Pipe</text><line x1="478" y1="410" x2="478" y2="262" stroke="#ffc857" stroke-width="2.5" marker-end="url(#fffc857)"/><line x1="467" y1="231" x2="489" y2="253" stroke="#ff8a7a" stroke-width="3"/><line x1="467" y1="253" x2="489" y2="231" stroke="#ff8a7a" stroke-width="3"/><rect x="398.5" y="198" width="159" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="478" y="217" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">CVE-2022-0492</text><rect x="900" y="150" width="440" height="190" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="922" y="182" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">CVE-2022-0492</text><text x="922" y="212" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Funcionaba SIN privilegios: bastaba un user</text><text x="922" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">namespace no privilegiado para llegar al</text><text x="922" y="252" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">release_agent de cgroup v1.</text><text x="922" y="272" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start"></text><text x="922" y="292" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Y aun así, la configuración por omisión lo</text><text x="922" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">tapaba. Quien lo sufrió había apagado algo.</text><rect x="900" y="360" width="440" height="190" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="922" y="392" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">el socket de Docker montado</text><text x="922" y="418" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start">-v /var/run/docker.sock:/var/run/…</text><text x="922" y="444" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">No rompe ninguna de las cuatro capas: las</text><text x="922" y="463" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">rodea. Quien habla con ese socket le pide al</text><text x="922" y="482" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">daemon —que es root— que monte / y corra</text><text x="922" y="501" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">otro contenedor con --privileged.</text><text x="922" y="520" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">No es un exploit: es entregar el host.</text><rect x="900" y="570" width="440" height="190" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="922" y="602" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Dirty Pipe (CVE-2022-0847)</text><text x="922" y="632" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Atraviesa las cuatro capas sin abrir ninguna,</text><text x="922" y="651" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">porque usa splice() y write(): dos syscalls</text><text x="922" y="670" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">que todo contenedor necesita y que ningún</text><text x="922" y="689" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">perfil razonable puede prohibir.</text><text x="922" y="708" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start"></text><text x="922" y="727" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Contra esto no hay bandera: hay parchar el kernel.</text><text x="700" y="812" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Las capas por omisión son buenas: el catálogo de fugas reales está lleno de configuraciones apagadas a mano, no de bugs del kernel.</text><text x="700" y="836" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Y cuando sí es un bug del kernel, ninguna de las cuatro ayuda — porque el kernel es uno solo y es el mismo para todos.</text></svg>