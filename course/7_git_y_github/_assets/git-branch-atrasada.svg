<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-label="Dos escenarios comparados. Arriba, la branch nace de un main atrasado y el pull request muestra como diferencia propia los commits del curso que faltaban, ademas de los archivos del estudiante. Abajo, la misma branch despues de traer main con un merge, y el pull request muestra solo los archivos del estudiante"><rect x="0" y="0" width="1080" height="580" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El pull request compara contra el punto donde las historias se separaron</text><rect x="40" y="72" width="1000" height="212" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><text x="64" y="102" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">Sin el bloque A</text><circle cx="110" cy="164" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="110" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c1</text><circle cx="200" cy="164" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="200" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c2</text><line x1="132" y1="164" x2="178" y2="164" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><circle cx="290" cy="164" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="290" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c3</text><line x1="222" y1="164" x2="268" y2="164" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><circle cx="380" cy="164" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="380" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c4</text><line x1="312" y1="164" x2="358" y2="164" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="420.0" y="150" width="170" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="505" y="169" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">main del curso</text><circle cx="250" cy="240" r="20" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="250" y="246" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">t1</text><circle cx="340" cy="240" r="20" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="340" y="246" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">t2</text><line x1="126" y1="182" x2="232" y2="230" stroke="#ff8a7a" stroke-width="1.8" marker-end="url(#fff8a7a)"/><line x1="272" y1="240" x2="318" y2="240" stroke="#ff8a7a" stroke-width="1.8" marker-end="url(#fff8a7a)"/><rect x="394.5" y="226" width="115" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="452" y="245" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">tu branch</text><rect x="600" y="118" width="412" height="120" rx="9" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.4"/><text x="806" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Lo que ve el pull request</text><text x="806" y="180" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">11 archivos: 9 del curso + 2 tuyos</text><text x="806" y="216" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">La revisión lo rechaza</text><rect x="40" y="320" width="1000" height="212" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="64" y="350" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="start">Con el bloque A, o con git merge main</text><circle cx="110" cy="412" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="110" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c1</text><circle cx="200" cy="412" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="200" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c2</text><line x1="132" y1="412" x2="178" y2="412" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><circle cx="290" cy="412" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="290" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c3</text><line x1="222" y1="412" x2="268" y2="412" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><circle cx="380" cy="412" r="20" fill="#0b0f12" stroke="#a7b8ad" stroke-width="2"/><text x="380" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c4</text><line x1="312" y1="412" x2="358" y2="412" stroke="#a7b8ad" stroke-width="1.8" marker-end="url(#fa7b8ad)"/><rect x="420.0" y="398" width="170" height="28" rx="6" fill="#0b0f12" stroke="#a7b8ad" stroke-width="1.2"/><text x="505" y="417" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">main del curso</text><circle cx="250" cy="488" r="20" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="250" y="494" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">t1</text><circle cx="340" cy="488" r="20" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="340" y="494" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">t2</text><line x1="126" y1="430" x2="232" y2="478" stroke="#7ef29d" stroke-width="1.8" marker-end="url(#f7ef29d)"/><line x1="272" y1="488" x2="318" y2="488" stroke="#7ef29d" stroke-width="1.8" marker-end="url(#f7ef29d)"/><rect x="394.5" y="474" width="115" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="452" y="493" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">tu branch</text><line x1="378" y1="432" x2="348" y2="468" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="420.0" y="428" width="170" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="505" y="447" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">git merge main</text><rect x="600" y="366" width="412" height="120" rx="9" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.4"/><text x="806" y="394" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Lo que ve el pull request</text><text x="806" y="428" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">2 archivos: sólo los tuyos</text><text x="806" y="464" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">La revisión lo acepta</text><text x="540.0" y="558" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Compruébalo antes de entregar:  git log --oneline tu-branch..upstream/main   ·   si no sale vacío, naciste atrasado</text></svg>