<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="La misma carpeta vista desde dos branches. A la izquierda, parado en la branch de tarea, el listado muestra el archivo de trabajo. A la derecha, despues de cambiarse a main, el mismo listado ya no lo muestra. Abajo, la cadena de commits explica por que: el archivo vive en el commit de la branch, y main nunca lo tuvo"><rect x="0" y="0" width="1080" height="520" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="40" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El archivo no se borró: tu carpeta se sincronizó con otro punto de la historia</text><rect x="40" y="72" width="474" height="214" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><rect x="60" y="90" width="434" height="38" rx="7" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="277" y="115" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git switch tarea-07-git</text><text x="74" y="158" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ls estudiantes/tu-login</text><text x="74" y="186" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">estudiantes/tu-login/</text><text x="74" y="214" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">└── nota.txt</text><text x="277" y="268" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">nota.txt está</text><rect x="566" y="72" width="474" height="214" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><rect x="586" y="90" width="434" height="38" rx="7" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="803" y="115" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">git switch main</text><text x="600" y="158" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ls estudiantes/tu-login</text><text x="600" y="186" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">estudiantes/tu-login/</text><text x="600" y="214" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">(vacía)</text><text x="803" y="268" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">nota.txt no está</text><line x1="522" y1="180" x2="560" y2="180" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="540.0" y="330" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Y sin embargo el archivo sigue guardado: vive en el commit de la branch</text><circle cx="300" cy="400" r="22" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="300" y="406" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C1</text><circle cx="430" cy="400" r="22" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="430" y="406" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C2</text><line x1="324" y1="400" x2="406" y2="400" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><circle cx="560" cy="400" r="22" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="560" y="406" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C3</text><line x1="454" y1="400" x2="536" y2="400" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><rect x="530.0" y="342" width="60" height="28" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="1.2"/><text x="560" y="361" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">main</text><circle cx="700" cy="400" r="22" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="700" y="406" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C4</text><line x1="584" y1="400" x2="676" y2="400" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="626.0" y="342" width="148" height="28" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="1.2"/><text x="700" y="361" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">tarea-07-git</text><text x="700" y="448" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aquí vive nota.txt</text><text x="430" y="448" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aquí nunca existió</text><text x="540.0" y="492" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Por eso Git se niega a cambiar de branch con trabajo sin commitear: el switch lo sobrescribiría.</text></svg>