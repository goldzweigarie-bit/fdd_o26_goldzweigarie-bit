# Ficha de la entrega 2 de la sección 9.1 (Ambientes): tu ambiente uv dentro
# de Docker. El esquema está en .github/tareas/README.md.

[tarea]
branch = "tarea-09-uv-docker"
asignacion = "uv-en-docker"
carpeta = "09_python"
available = "2026-10-01"
due = "2026-10-06"
penalizacion_tarde = "1/dia"
ia = "permitida-revisada"
debe_explicar = [
  "qué fija uv.lock que pyproject.toml no fija",
  "por qué el Dockerfile copia pyproject.toml y uv.lock antes que el código, y qué se reusa de la caché cuando sólo cambia reporte.py",
  "qué hace --locked y qué pasa si el lock no coincide con pyproject.toml",
  "por qué el .venv de su máquina no debe entrar a la imagen, y qué pasa si entra",
  "por qué las versiones de los paquetes salen iguales dentro y fuera del contenedor, y el intérprete y sys.prefix no",
  "qué muestra la fila que agregó y de qué paquete sale",
]
pagina = "Página «Las entregas de ambientes» (https://rayalucaria.org/fdd_o26/python/ambientes/b-entregas/)"

[entregables]
requeridos = [
  "uv_docker/reporte.py",
  "uv_docker/pyproject.toml",
  "uv_docker/uv.lock",
  "uv_docker/Dockerfile",
  "uv_docker/.dockerignore",
  "uv_docker/bitacora.md",
]
prohibidos = []

